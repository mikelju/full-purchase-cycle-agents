<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders test page</title>
<style>
  body { font-family: sans-serif; margin: 1rem 2rem; max-width: 70rem; }
  h1 { margin-bottom: 0; }
  fieldset { margin: 1rem 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #bbb; padding: 0.2rem 0.5rem; text-align: left; }
  td.num { text-align: right; }
  .scroll { max-height: 18rem; overflow: auto; }
  textarea, input[type=text] { width: 100%; box-sizing: border-box; }
  .entry { border: 1px solid #888; margin: 0.6rem 0; padding: 0.5rem; }
  .entry pre { white-space: pre-wrap; margin: 0.3rem 0; background: #f4f4f4; padding: 0.4rem; }
  .error { color: #a00; font-weight: bold; }
  .hint { color: #555; }
</style>
</head>
<body>
<h1>Orders test page</h1>
<p class="hint" id="mode"></p>
<p class="error" id="error"></p>

<fieldset>
  <legend>Catalog</legend>
  <label>Filter <input type="text" id="filter" placeholder="SKU, name or family"></label>
  <div class="scroll">
    <table>
      <thead><tr><th>SKU</th><th>Name</th><th>Family</th><th>Sale unit</th><th>Price EUR</th><th>Stock</th></tr></thead>
      <tbody id="catalog"></tbody>
    </table>
  </div>
</fieldset>

<fieldset>
  <legend>Send an order</legend>
  <p>
    <label>Channel
      <select id="channel">
        <option value="web_form">Web form</option>
        <option value="email">Email</option>
        <option value="whatsapp">WhatsApp</option>
      </select>
    </label>
    <label>Customer <select id="customer"></select></label>
    <span class="hint" id="identity"></span>
  </p>

  <div id="form-web_form">
    <div id="lines"></div>
    <button type="button" id="add-line">Add line</button>
    <datalist id="products"></datalist>
  </div>

  <div id="form-email" hidden>
    <p><label>Subject <input type="text" id="subject"></label></p>
    <p><label>Body <textarea id="body" rows="6"></textarea></label></p>
  </div>

  <div id="form-whatsapp" hidden>
    <p><label>Message <textarea id="text" rows="4"></textarea></label></p>
    <p><label><input type="checkbox" id="photo"> Send a photo instead of text</label></p>
  </div>

  <p><button type="button" id="send">Send</button></p>
</fieldset>

<fieldset>
  <legend>Conversations</legend>
  <div id="conversations"></div>
</fieldset>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let customers = [];

function showError(message) { $("error").textContent = message || ""; }

async function api(path, body) {
  const options = body === undefined ? {} : {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
  let response, data;
  try {
    response = await fetch(path, options);
    data = await response.json();
  } catch (error) {
    throw new Error("The server did not answer: " + error.message);
  }
  if (!response.ok) throw new Error(data.error || ("Error " + response.status));
  return data;
}

function cell(tr, text, className) {
  const td = document.createElement("td");
  td.textContent = text;
  if (className) td.className = className;
  tr.appendChild(td);
}

function renderCatalog(products) {
  const needle = $("filter").value.trim().toLowerCase();
  const body = $("catalog");
  body.textContent = "";
  for (const p of products) {
    if (needle && !(p.sku + " " + p.name + " " + p.family).toLowerCase().includes(needle)) continue;
    const tr = document.createElement("tr");
    cell(tr, p.sku); cell(tr, p.name); cell(tr, p.family); cell(tr, p.sale_unit);
    cell(tr, p.price_eur.toFixed(2), "num"); cell(tr, String(p.stock), "num");
    body.appendChild(tr);
  }
}

function addLine() {
  const row = document.createElement("div");
  const product = document.createElement("input");
  product.type = "text"; product.className = "product"; product.placeholder = "Product";
  product.setAttribute("list", "products");
  const quantity = document.createElement("input");
  quantity.type = "number"; quantity.className = "quantity"; quantity.min = "1"; quantity.value = "1";
  quantity.style.width = "6rem";
  const remove = document.createElement("button");
  remove.type = "button"; remove.textContent = "Remove";
  remove.onclick = () => row.remove();
  row.append(product, " ", quantity, " ", remove);
  $("lines").appendChild(row);
}

function currentCustomer() { return customers.find((c) => c.code === $("customer").value); }

function showChannel() {
  const channel = $("channel").value;
  for (const name of ["web_form", "email", "whatsapp"]) $("form-" + name).hidden = name !== channel;
  const c = currentCustomer();
  if (!c) { $("identity").textContent = ""; return; }
  $("identity").textContent = channel === "email" ? "sends from " + c.email
    : channel === "whatsapp" ? "sends from " + c.phone : "customer code " + c.code;
}

function payload() {
  const channel = $("channel").value;
  const base = {channel, customer: $("customer").value};
  if (channel === "web_form") {
    const lines = [...$("lines").children].map((row) => ({
      product: row.querySelector(".product").value,
      quantity: Number(row.querySelector(".quantity").value)}));
    return {...base, lines};
  }
  if (channel === "email") return {...base, subject: $("subject").value, body: $("body").value};
  return $("photo").checked ? {...base, type: "image"} : {...base, text: $("text").value};
}

async function send() {
  showError("");
  $("send").disabled = true;
  try {
    await api("/api/send", payload());
    if ($("channel").value === "whatsapp") { $("text").value = ""; }
    await loadConversations();
  } catch (error) { showError(error.message); }
  $("send").disabled = false;
}

async function answer(entry, box, button) {
  showError("");
  button.disabled = true;
  try {
    await api("/api/answer", {thread_id: entry.thread_id, text: box.value});
    await loadConversations();
  } catch (error) { showError(error.message); button.disabled = false; }
}

function answerWhatsApp(entry, box) {
  $("channel").value = "whatsapp";
  $("customer").value = entry.customer;
  $("photo").checked = false;
  $("text").value = "";
  showChannel();
  $("text").focus();
}

function line(parent, label, value) {
  if (value === null || value === undefined || value === "") return;
  const p = document.createElement("div");
  p.textContent = label + ": " + value;
  parent.appendChild(p);
}

function renderConversations(entries) {
  const root = $("conversations");
  root.textContent = "";
  if (!entries.length) { root.textContent = "Nothing sent yet."; return; }
  for (const entry of [...entries].reverse()) {
    const div = document.createElement("div");
    div.className = "entry";
    const title = document.createElement("strong");
    title.textContent = entry.at + "  " + entry.channel + "  " + entry.customer + " " + entry.customer_name;
    div.appendChild(title);
    line(div, "Sent", entry.sent);
    line(div, "Route", entry.route + (entry.reason ? " (" + entry.reason + ")" : ""));
    line(div, "Thread", entry.thread_id);
    line(div, "Outcome", entry.outcome);
    line(div, "Order", entry.order_id);
    if (entry.reply) {
      const asking = entry.status === "question" || entry.status === "answer_rejected";
      const label = asking ? "Question to the customer" : "Reply to the customer";
      line(div, label, "");
      const pre = document.createElement("pre");
      pre.textContent = entry.reply;
      div.appendChild(pre);
    }
    if (entry.pending && entry.can_answer) {
      const box = document.createElement("input");
      box.type = "text"; box.placeholder = "The customer's answer";
      const button = document.createElement("button");
      button.type = "button"; button.textContent = "Answer";
      button.onclick = () => answer(entry, box, button);
      div.append(box, button);
    } else if (entry.pending) {
      const button = document.createElement("button");
      button.type = "button"; button.textContent = "Answer with a WhatsApp message";
      button.onclick = () => answerWhatsApp(entry);
      div.appendChild(button);
    }
    root.appendChild(div);
  }
}

async function loadConversations() { renderConversations(await api("/api/conversations")); }

async function start() {
  try {
    const info = await api("/api/info");
    $("mode").textContent = "Mode: " + info.mode + (info.mode === "replay"
      ? " (only the recorded sample texts are understood)" : " (the model answers; it costs a few cents per order)");
    const products = await api("/api/catalog");
    renderCatalog(products);
    $("filter").oninput = () => renderCatalog(products);
    for (const p of products) {
      const option = document.createElement("option");
      option.value = p.name;
      $("products").appendChild(option);
    }
    customers = await api("/api/customers");
    for (const c of customers) {
      const option = document.createElement("option");
      option.value = c.code;
      option.textContent = c.code + " " + c.name + " - " + c.email + " - " + c.phone;
      $("customer").appendChild(option);
    }
    addLine();
    showChannel();
    await loadConversations();
  } catch (error) { showError(error.message); }
}

$("channel").onchange = showChannel;
$("customer").onchange = showChannel;
$("add-line").onclick = addLine;
$("send").onclick = send;
start();
</script>
</body>
</html>
