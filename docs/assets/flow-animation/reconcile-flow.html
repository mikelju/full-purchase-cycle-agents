<title>Reconcile Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap">
<style>
/* Layout: one fixed 16:9 stage (GIF-ready) - documents | reconcile graph + three-way match | database. Single deliberate light, high-contrast look, independent of the OS theme. */
:root {
  --ground: #EDF1F7;
  --panel: #FFFFFF;
  --panel-edge: #B9C4D4;
  --ink: #0F172A;
  --muted: #475569;
  --line: #8A99AF;
  --node: #FFFFFF;
  --node-edge: #5B6B82;
  --active: #0891B2;
  --title: #4338CA;
  --done: #0D9488;
  --done-soft: #CCFBF1;
  --done-ink: #134E4A;
  --msg: #D97706;
  --msg-soft: #FEF3C7;
  --msg-ink: #92400E;
  --ask: #2563EB;
  --idle: #F4F6FA;
  --wa: #25D366;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --sans: "Inter", system-ui, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { background: var(--ground); color: var(--ink); }
body { font-family: var(--sans); padding-block: 16px; padding-inline: 16px; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 10px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 600 14px/1.3 var(--mono); letter-spacing: .02em; margin: 0; text-wrap: balance; color: var(--title); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: 500 12px var(--mono); color: var(--ink); background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button:hover { border-color: var(--active); color: var(--title); }
button:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
.stage { overflow-x: auto; }
svg { display: block; width: 100%; min-width: 0; height: auto; background: var(--ground); }
body.clean header { display: none; }

.frame { fill: var(--panel); stroke: var(--panel-edge); stroke-width: 1.2; filter: url(#shadow); }
.subframe { fill: var(--idle); stroke: var(--node-edge); stroke-dasharray: 4 4; transition: fill .4s, stroke .4s; }
.subframe.open { fill: #ECFEFF; stroke: var(--active); stroke-width: 1.6; }
.flabel { font: 700 12px var(--mono); fill: var(--title); letter-spacing: .16em; text-transform: uppercase; }
.small { font: 400 11px var(--mono); fill: var(--muted); }
.cond { font: 700 11.5px var(--mono); fill: var(--ink); }

.node rect { fill: var(--node); stroke: var(--node-edge); stroke-width: 1.4; transition: fill .3s, stroke .3s; }
.node text { font: 600 13px var(--mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; transition: fill .3s; }
.node.sub rect { stroke-width: 1.4; }
.node.sub .inner { fill: none; stroke: var(--node-edge); }
.node circle { fill: var(--node); stroke: var(--muted); stroke-width: 1.6; transition: fill .3s, stroke .3s; }
.node.endc circle.dot { fill: var(--muted); stroke: none; }
.node.active rect { fill: var(--oc, var(--active)); stroke: var(--oc, var(--active)); }
.node.active rect:not(.ring):not(.inner) { filter: url(#glow); }
.node.active .inner { stroke: var(--ot, #0F172A); stroke-opacity: .6; fill: none; }
.node.active text { fill: var(--ot, #0F172A); font-weight: 700; }
.node.active circle { stroke: var(--oc, var(--active)); }
.node.active circle.dot { fill: var(--oc, var(--active)); }
.node rect.ring, .node.active rect.ring, .node.done rect.ring, .node.paused rect.ring { fill: none; stroke: var(--rc, var(--active)); stroke-width: 2.4; stroke-dasharray: none; animation: none; opacity: 0; transition: opacity .3s; filter: url(#glow-s); }
.node.dual rect.ring { opacity: 1; }
.node.done rect { fill: var(--done-soft); stroke: var(--done); stroke-width: 1.8; }
.node.done .inner { fill: none; stroke: var(--done); stroke-opacity: .5; }
.node.done text { fill: var(--done-ink); }
.node.done circle { stroke: var(--done); }
.node.done circle.dot { fill: var(--done); }
.node.paused rect { fill: var(--msg-soft); stroke: var(--msg); stroke-width: 2; stroke-dasharray: 5 3; animation: dash 1s linear infinite; }
.node.paused .inner { fill: none; }
.node.paused text { fill: var(--msg-ink); font-weight: 700; }
@keyframes dash { to { stroke-dashoffset: -16; } }
.idlegroup { opacity: .45; }

.edge { fill: none; stroke: var(--line); stroke-width: 1.6; transition: stroke .3s; }
.edge.hot { stroke: var(--oc, var(--active)); stroke-width: 2.6; stroke-dasharray: 9 5; animation: flow .45s linear infinite; filter: url(#glow-e); }
@keyframes flow { to { stroke-dashoffset: -14; } }
.edge.done { stroke: var(--done); stroke-opacity: .9; stroke-width: 2; }
.link { stroke: var(--node-edge); stroke-dasharray: 3 4; fill: none; }

.table rect.t { fill: #F8FAFC; stroke: var(--panel-edge); transition: stroke .3s; }
.table text.tn { font: 700 11px var(--mono); fill: #1E293B; }
.table.flash rect.t { stroke: var(--active); stroke-width: 2; filter: url(#glow-s); }
.chip { opacity: 0; transition: opacity .4s; }
.chip.on { opacity: 1; }
.chip rect { stroke-width: 1; }
.chip text { font: 500 10.5px var(--mono); dominant-baseline: central; white-space: pre; }
.chip.pending rect:first-child { fill: var(--msg-soft); stroke: var(--msg); }
.chip.ok rect:first-child { fill: var(--done-soft); stroke: var(--done); }
.chip.bad rect:first-child { fill: #FFF1F2; stroke: #E11D48; }
.chip.zero rect:first-child { fill: var(--idle); stroke: var(--line); }
.chip text { fill: var(--ink); }

.tok { opacity: 0; transition: opacity .25s; filter: url(#glow-t); }
.tok.on { opacity: 1; }
.typing circle { fill: var(--title); opacity: 0; }
.typing.on circle { animation: blink 1s infinite; }
.typing.on circle:nth-child(2) { animation-delay: .2s; }
.typing.on circle:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
.clock { opacity: 0; transition: opacity .3s; filter: url(#glow-s); }
.clock.on { opacity: 1; }
.clock.on .hand { animation: spin 1.2s linear infinite; transform-origin: 0 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.check { opacity: 0; transition: opacity .3s; filter: url(#glow-s); }
.check.on { opacity: 1; }
.progress { fill: url(#prog); }
@media (prefers-reduced-motion: reduce) {
  .node.paused rect, .clock.on .hand, .typing.on circle, .edge.hot { animation: none; }
}
.fx { opacity: 0; transition: opacity .4s; }
.fx.on { opacity: 1; }
.card .cr { fill: #fff; stroke: var(--panel-edge); stroke-width: 1.4; transition: stroke .3s, fill .3s; }
.card.bad .cr { stroke: #E11D48; stroke-dasharray: 5 3; fill: #FFF1F2; }
.card.win .cr { stroke: var(--done); stroke-width: 2.6; fill: #F0FDFA; filter: url(#glow-s); }
.card .ch { font: 700 12px var(--mono); fill: var(--ink); }
.card .cn { font: 400 10.5px var(--sans); fill: var(--muted); }
.card .cq { font: 400 11px var(--sans); fill: #334155; }
.card .cf { font: 500 10.5px var(--mono); fill: var(--ink); }
.pillt { font: 700 10px var(--mono); fill: #fff; dominant-baseline: central; text-anchor: middle; }
.rule rect { fill: var(--idle); stroke: var(--panel-edge); transition: fill .4s, stroke .4s; }
.rule text { font: 600 10.5px var(--mono); fill: var(--muted); dominant-baseline: central; text-anchor: middle; transition: fill .4s; }
.rule.lit rect { fill: var(--done-soft); stroke: var(--done); stroke-width: 2; }
.rule.lit text { fill: var(--done-ink); font-weight: 700; }
.rule.dim { opacity: .55; }
.box { fill: #fff; stroke: var(--panel-edge); stroke-width: 1.4; }
.bt { font: 700 12px var(--mono); fill: var(--ink); }
.bs { font: 400 11px var(--mono); fill: var(--muted); }
.bm { font: 500 11px var(--mono); fill: var(--ink); }
</style>

<div class="wrap">
  <header>
    <h1>reconcile graph (read, extract, link, match, store) - supplier invoice vs purchase order vs delivery note</h1>
    <div class="controls">
      <button id="btn-pause" type="button">Pause</button>
      <button id="btn-restart" type="button">Restart</button>
      <button id="btn-speed" type="button">Speed 1x</button>
      <button id="btn-clean" type="button">Clean frame</button>
    </div>
  </header>
  <div class="stage">
  <svg id="svg" viewBox="0 0 1280 720" role="img" aria-label="Animated flow of supplier invoices and delivery notes through the reconciliation graph: read, extract with Claude Haiku 4.5, link to the purchase order, deterministic three-way match and storage, ending in matched, discrepancies or awaiting delivery note">
    <defs>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#EDF1F7"/><circle cx="12" cy="12" r="1.1" fill="#D3DAE5"/></pattern>
      <linearGradient id="prog" x1="0" x2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset=".5" stop-color="#0891B2"/><stop offset="1" stop-color="#0D9488"/></linearGradient>
      <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1E293B" flood-opacity=".14"/></filter>
      <filter id="glow" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/><feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/><feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope=".6"/></feComponentTransfer><feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-t" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/><feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope=".4"/></feComponentTransfer><feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-e" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720"><feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A99AF"/></marker>
      <marker id="arr-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
      <marker id="arr-done" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker>
    </defs>

    <rect width="1280" height="720" fill="url(#dots)"/>

    <!-- left: documents -->
    <rect class="frame" x="24" y="56" width="170" height="428" rx="10"/>
    <text class="flabel" x="36" y="80">documents/</text>
    <text class="small" x="36" y="98">txt . pdf . xlsx</text>
    <text class="small" x="109" y="446" text-anchor="middle">14 files, sorted by name</text>
    <text class="small" x="109" y="464" text-anchor="middle">delivery notes first</text>
    <g id="files"></g>
    <rect class="frame" x="24" y="496" width="170" height="194" rx="10"/>
    <path d="M36,512 h9 l3,4 h12 v13 h-24 z" fill="none" stroke="#4338CA" stroke-width="1.4"/>
    <text class="flabel" x="68" y="526" style="letter-spacing:.06em;text-transform:none">later/</text>
    <text class="small" x="36" y="548">second scan</text>
    <g id="later"></g>

    <!-- center: graph + three-way match -->
    <rect class="frame" x="220" y="56" width="800" height="112" rx="10"/>
    <text class="flabel" x="232" y="78">reconcile graph</text>
    <text class="small" x="1008" y="78" text-anchor="end">one run per file - thread = SHA-256 of the content</text>
    <g id="graph"></g>
    <rect class="frame" x="220" y="182" width="800" height="508" rx="10"/>
    <text class="flabel" x="232" y="204">three-way match</text>
    <text class="small" x="1008" y="204" text-anchor="end">order vs delivery note vs invoice</text>
    <g id="match"></g>

    <!-- right: database -->
    <rect class="frame" x="1046" y="56" width="210" height="428" rx="10"/>
    <ellipse cx="1068" cy="76" rx="10" ry="4" fill="none" stroke="#4338CA"/>
    <path d="M1058,76 v12 a10,4 0 0 0 20,0 v-12" fill="none" stroke="#4338CA"/>
    <text class="flabel" x="1086" y="86">purchase_cycle.db</text>
    <rect class="frame" x="1046" y="496" width="210" height="194" rx="10"/>
    <text class="flabel" x="1058" y="520" style="letter-spacing:.06em;text-transform:none">reconcile list</text>
    <g id="tables"></g>
    <g id="list"></g>

    <g class="clock" id="mclock" transform="translate(796,98)"><circle r="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><line class="hand" x1="0" y1="0" x2="0" y2="-7" stroke="#B45309" stroke-width="2" stroke-linecap="round"/></g>

    <g id="ptoks"></g>

    <rect x="24" y="704" width="1232" height="4" rx="2" fill="#D5DCE6"/>
    <rect class="progress" id="progress" x="24" y="704" width="0" height="4" rx="2"/>
  </svg>
  </div>
</div>

<script>
const SVGNS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const el = (tag, attrs, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (attrs, s, parent) => { const e = el("text", attrs, parent); e.textContent = s; return e; };

const TEAL = "#0D9488", AMBER = "#D97706", ROSE = "#E11D48", PURPLE = "#7C3AED";

// ---------- sample data (examples/invoices) ----------
const CASES = [
  { id: "INV-0006", po: "PO-0001", detail: true,
    dn: { file: "dn-001-nitrile.txt", t: "TXT", ext: "delivery note  A-5001  PO-0001  GLV-NIT-M 100" },
    inv: { file: "inv-001-nitrile.txt", t: "TXT", ext: "invoice  F-2026-1001  PO-0001  GLV-NIT-M 100 x 4.20" },
    rows: [{ sku: "GLV-NIT-M", o: "100 x 4.20", d: "100", i: "100 x 4.20", s: { o: "ok", d: "ok", i: "ok" } }],
    result: "matched", diffs: [] },
  { id: "INV-0007", po: "PO-0002",
    dn: { file: "dn-002-masks.xlsx", t: "XLSX", ext: "delivery note  AL-3002  PO-0002  MASK-IIR 50" },
    inv: { file: "inv-002-masks.pdf", t: "PDF", ext: "invoice  N-77002  PO-0002  MASK-IIR 50 x 3.40" },
    rows: [{ sku: "MASK-IIR", o: "50 x 3.00", d: "50", i: "50 x 3.40", s: { o: "ok", d: "ok", i: "bad" } }],
    result: "discrepancies", diffs: [["price", "MASK-IIR  3.00 -> 3.40  +0.40/unit  20.00 EUR"]] },
  { id: "INV-0008", po: "PO-0003",
    dn: { file: "dn-003-gauze.txt", t: "TXT", ext: "delivery note  E-0303  PO-0003  GAUZE-NS-5 40" },
    inv: { file: "inv-003-gauze.xlsx", t: "XLSX", ext: "invoice  LV-0303  PO-0003  GAUZE-NS-5 35 x 5.00" },
    rows: [{ sku: "GAUZE-NS-5", o: "40 x 5.00", d: "40", i: "35 x 5.00", s: { o: "ok", d: "ok", i: "bad" } }],
    result: "discrepancies", diffs: [["quantity", "GAUZE-NS-5  ordered 40, invoiced 35  -25.00 EUR"]] },
  { id: "INV-0010", po: "PO-0005",
    dn: { file: "dn-005-saline.txt", t: "TXT", ext: "delivery note  AL-3005  PO-0005  SAL-500 60" },
    inv: { file: "inv-005-saline.txt", t: "TXT", ext: "invoice  N-77005  PO-0005  SAL-250 60 x 1.80" },
    rows: [{ sku: "SAL-500", o: "60 x 1.80", d: "60", i: "-", s: { o: "ok", d: "ok", i: "bad" } },
           { sku: "SAL-250", o: "-", d: "-", i: "60 x 1.80", s: { o: "dim", d: "dim", i: "bad" } }],
    result: "discrepancies", diffs: [["extra_line", "SAL-250  not in the order  108.00 EUR"], ["missing_line", "SAL-500  absent from invoice  108.00 EUR"]] },
  { id: "INV-0011", po: "PO-0006", awaiting: true,
    inv: { file: "inv-006-thermometers.xlsx", t: "XLSX", ext: "invoice  LV-0306  PO-0006  THERM-DIG 20 x 7.00" },
    rows: [{ sku: "THERM-DIG", o: "20 x 7.00", d: "none yet", i: "20 x 7.00", s: { o: "ok", d: "pend", i: "ok" } }],
    result: "awaiting_delivery_note", diffs: [] },
];
const LATER = { file: "dn-006-thermometers.pdf", t: "PDF", ext: "delivery note  E-0306  PO-0006  THERM-DIG 20", d: "20" };
const RES = {
  matched: { color: TEAL, label: "MATCHED", list: "matched", cls: "ok" },
  discrepancies: { color: ROSE, label: "DISCREPANCIES", list: "discrepancies", cls: "bad" },
  awaiting_delivery_note: { color: AMBER, label: "AWAITING_DELIVERY_NOTE", list: "awaiting", cls: "pending" },
};

// ---------- left: file cards ----------
const SLOT = [144, 214];
const BADGE = { TXT: "#475569", PDF: ROSE, XLSX: "#15803D" };
let fileEls = [];
function fileCard(parent, cy, f, kind) {
  const g = el("g", {}, parent);
  const r = el("rect", { x: 34, y: cy - 28, width: 150, height: 56, rx: 8, fill: "#fff", stroke: "#B9C4D4", "stroke-width": 1.4 }, g);
  const w = f.t.length * 7 + 12;
  el("rect", { x: 42, y: cy - 22, width: w, height: 14, rx: 7, fill: BADGE[f.t] }, g);
  txt({ x: 42 + w / 2, y: cy - 15, style: "font:700 9px var(--mono);fill:#fff;dominant-baseline:central;text-anchor:middle" }, f.t, g);
  txt({ x: 42, y: cy + 6, style: "font:600 10px var(--mono);fill:var(--ink)" }, f.file, g);
  txt({ x: 42, y: cy + 21, style: "font:400 10.5px var(--sans);fill:var(--muted)" }, kind, g);
  return { g, r };
}
function setFiles(list) {
  $("files").innerHTML = ""; fileEls = [];
  list.forEach(([f, kind], i) => fileEls.push(fileCard($("files"), SLOT[i], f, kind)));
}
function markFile(i, on) { const r = fileEls[i].r; r.setAttribute("stroke", on ? PURPLE : "#B9C4D4"); r.setAttribute("stroke-width", on ? 2.4 : 1.4); }

// ---------- graph ----------
const NH = 38, NW = 92, GY = 112;
const N = {
  r_start: { x: 250, c: 1 }, read: { x: 360, label: "read" }, extract: { x: 490, label: "extract" }, link: { x: 620, label: "link" },
  match: { x: 750, label: "match" }, store: { x: 880, label: "store" }, r_end: { x: 975, c: 2 },
};
const ORDER = Object.keys(N);
for (const k in N) N[k].y = GY;
const rad = n => n.c ? 9 : NW / 2;
const edgeEls = {}, nodeEls = {};
const GR = $("graph");
for (let i = 1; i < ORDER.length; i++) {
  const A = N[ORDER[i - 1]], B = N[ORDER[i]];
  edgeEls[ORDER[i - 1] + ">" + ORDER[i]] = el("polyline", { class: "edge", points: `${A.x + rad(A)},${GY} ${B.x - rad(B) - 1},${GY}`, "marker-end": "url(#arr)" }, GR);
}
for (const k of ORDER) {
  const n = N[k];
  const g = el("g", { class: "node" + (n.c === 2 ? " endc" : ""), transform: `translate(${n.x},${n.y})` }, GR);
  g.style.setProperty("--oc", PURPLE); g.style.setProperty("--ot", "#FFFFFF");
  if (n.c) { el("circle", { r: 9 }, g); if (n.c === 2) el("circle", { class: "dot", r: 5 }, g); }
  else {
    el("rect", { class: "ring", x: -NW / 2 - 4, y: -NH / 2 - 4, width: NW + 8, height: NH + 8, rx: 11 }, g);
    el("rect", { x: -NW / 2, y: -NH / 2, width: NW, height: NH, rx: 8 }, g);
    txt({}, n.label, g);
  }
  nodeEls[k] = g;
}
[["read", "txt pdf xlsx"], ["extract", "Claude Haiku 4.5"], ["link", "PO-NNNN"], ["match", "plain code"], ["store", "SQLite"]].forEach(([k, s]) =>
  txt({ class: "small", x: N[k].x, y: 154, "text-anchor": "middle" }, s, GR));

function node(k, state) { const g = nodeEls[k]; g.classList.remove("active", "done", "paused"); if (state) g.classList.add(state); }
function edge(a, b, state) {
  const e = edgeEls[a + ">" + b];
  e.classList.remove("hot", "done"); if (state) e.classList.add(state);
  e.setAttribute("marker-end", state === "hot" ? "url(#arr-hot)" : state === "done" ? "url(#arr-done)" : "url(#arr)");
}
function resetGraph() { for (const k of ORDER) node(k, null); for (let i = 1; i < ORDER.length; i++) edge(ORDER[i - 1], ORDER[i], null); }

// ---------- database ----------
const TB = {
  supplier_documents: { y: 96, h: 64 }, document_lines: { y: 168, h: 48 }, reconciliations: { y: 224, h: 48 }, discrepancies: { y: 280, h: 140 },
};
const tableEls = {};
for (const k in TB) {
  const t = TB[k], g = el("g", { class: "table" }, $("tables"));
  el("rect", { class: "t", x: 1054, y: t.y, width: 194, height: t.h, rx: 6 }, g);
  txt({ class: "tn", x: 1062, y: t.y + 16 }, k, g);
  tableEls[k] = g;
}
const recRef = txt({ class: "small", x: 1240, y: 240, "text-anchor": "end" }, "", tableEls.reconciliations);
function chip(parent, y, text, cls, color, x0, w) {
  const g = el("g", { class: "chip " + cls }, parent);
  el("rect", { x: x0, y: y - 10, width: w, height: 20, rx: 4 }, g);
  if (color) el("rect", { x: x0, y: y - 10, width: 5, height: 20, rx: 2, fill: color, style: "stroke:none" }, g);
  txt({ x: x0 + (color ? 11 : 8), y }, text, g);
  return g;
}
const dbchip = (t, y, text, cls, color) => chip(tableEls[t], y, text, cls, color, 1062, 178);
const setChip = (c, text, cls) => { c.setAttribute("class", "chip " + cls + (c.classList.contains("on") ? " on" : "")); c.querySelector("text").textContent = text; };
const chips = {
  dn: dbchip("supplier_documents", 126, "", "ok", TEAL),
  inv: dbchip("supplier_documents", 148, "", "ok", PURPLE),
  line: dbchip("document_lines", 198, "", "ok", PURPLE),
  rec: dbchip("reconciliations", 254, "", "ok", TEAL),
};
const TYPES = ["price", "quantity", "extra_line", "missing_line"];
const counts = {};
const tchips = {};
TYPES.forEach((t, i) => { tchips[t] = dbchip("discrepancies", 308 + i * 28, "", "zero", ROSE); fxOn(tchips[t]); });
function showCounts() {
  for (const t of TYPES) setChip(tchips[t], t.padEnd(14) + (counts[t] || 0), counts[t] ? "bad" : "zero");
}
const listChips = [];
for (let i = 0; i < 5; i++) listChips.push(chip($("list"), 548 + i * 24, "", "ok", TEAL, 1054, 194));

// ---------- center: three-way match ----------
const MG = $("match");
const ext = el("g", { class: "fx" }, MG);
el("rect", { class: "box", x: 240, y: 220, width: 756, height: 70, rx: 10 }, ext);
const extL = [0, 1].map(i => txt({ x: 256, y: 246 + i * 26, class: "fx", style: "font:600 14px var(--mono);fill:var(--ink)" }, "", ext));
const pill = el("g", { class: "fx" }, MG);
el("rect", { x: 884, y: 230, width: 100, height: 24, rx: 12, fill: "#EEF2FF", stroke: "#4338CA", "stroke-width": 1.6 }, pill);
txt({ x: 934, y: 242, style: "font:700 12px var(--mono);fill:#4338CA;dominant-baseline:central;text-anchor:middle" }, "Haiku 4.5", pill);

const CX = [360, 580, 800], CWID = 200, RYS = [334, 386], CH = 44;
const HEAD = ["purchase order", "delivery note", "invoice"];
const heads = HEAD.map((h, i) => txt({ x: CX[i] + CWID / 2, y: 318, style: "font:700 12px var(--mono);fill:var(--muted);text-anchor:middle" }, h, MG));
const led = [0, 1].map(r => {
  const label = txt({ x: 240, y: RYS[r] + CH / 2 + 1, class: "fx", style: "font:700 13px var(--mono);fill:var(--ink);dominant-baseline:central" }, "", MG);
  const cells = CX.map(x => {
    const g = el("g", { class: "fx" }, MG);
    const rect = el("rect", { x, y: RYS[r], width: CWID, height: CH, rx: 8, fill: "#fff", stroke: "#B9C4D4", "stroke-width": 1.4 }, g);
    const text = txt({ x: x + CWID / 2, y: RYS[r] + CH / 2 + 1, style: "font:600 17px var(--mono);fill:var(--ink);dominant-baseline:central;text-anchor:middle" }, "", g);
    return { g, rect, text };
  });
  return { label, cells };
});
const CELLSTYLE = {
  norm: ["#fff", "#B9C4D4", 1.4, "#0F172A", ""],
  ok: ["#F0FDFA", TEAL, 2.2, "#134E4A", ""],
  bad: ["#FFF1F2", ROSE, 2.6, "#9F1239", "5 3"],
  pend: ["#FEF3C7", AMBER, 2.4, "#92400E", "5 3"],
  dim: ["#F4F6FA", "#CBD5E1", 1.2, "#94A3B8", ""],
};
function setCell(r, c, text, state) {
  const cell = led[r].cells[c], s = CELLSTYLE[state || "norm"];
  if (text !== null) cell.text.textContent = text;
  cell.rect.setAttribute("fill", s[0]); cell.rect.setAttribute("stroke", s[1]); cell.rect.setAttribute("stroke-width", s[2]);
  if (s[4]) cell.rect.setAttribute("stroke-dasharray", s[4]); else cell.rect.removeAttribute("stroke-dasharray");
  cell.text.style.fill = s[3];
  cell.g.classList.add("on");
}

const rule = el("g", { class: "fx" }, MG);
el("rect", { x: 240, y: 440, width: 470, height: 32, rx: 16, style: "fill:#CCFBF1;stroke:#0D9488;stroke-width:2" }, rule);
txt({ x: 475, y: 457, style: "font:700 14px var(--mono);fill:#134E4A;dominant-baseline:central;text-anchor:middle" }, "tolerance: price 0.01 EUR/unit, quantity 0", rule);
const resG = el("g", { class: "fx" }, MG);
const resId = txt({ x: 240, y: 502, style: "font:700 22px var(--mono);fill:var(--ink);dominant-baseline:central" }, "", resG);
const resRect = el("rect", { x: 372, y: 482, width: 150, height: 40, rx: 20, fill: TEAL }, resG);
const resTxt = txt({ x: 0, y: 502, style: "font:700 18px var(--mono);fill:#fff;dominant-baseline:central;text-anchor:middle" }, "", resG);
const diffG = el("g", { class: "fx" }, MG);
el("rect", { class: "box", x: 240, y: 544, width: 756, height: 132, rx: 10 }, diffG);
const note = txt({ x: 256, y: 610, class: "fx", style: "font:600 17px var(--mono);fill:var(--muted);dominant-baseline:central" }, "", diffG);
const dRows = [0, 1].map(i => {
  const g = el("g", { class: "fx" }, diffG);
  const rect = el("rect", { x: 256, y: 560 + i * 56, width: 100, height: 34, rx: 17, fill: ROSE }, g);
  const tt = txt({ x: 0, y: 577 + i * 56, style: "font:700 14px var(--mono);fill:#fff;dominant-baseline:central;text-anchor:middle" }, "", g);
  const tx = txt({ x: 0, y: 577 + i * 56, style: "font:600 16px var(--mono);fill:var(--ink);dominant-baseline:central" }, "", g);
  return { g, rect, tt, tx };
});

function docTok(id, color) {
  el("g", { class: "tok", id }, $("ptoks")).innerHTML = `<rect x="-12" y="-15" width="24" height="30" rx="3" fill="${color}"/><rect x="-7" y="-9" width="14" height="3" rx="1" fill="#fff"/><rect x="-7" y="-3" width="14" height="3" rx="1" fill="#fff"/><rect x="-7" y="3" width="9" height="3" rx="1" fill="#fff"/>`;
}
docTok("tdn", TEAL); docTok("tinv", PURPLE);

// ---------- timeline engine ----------
let runId = 0, paused = false, speed = 1;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
function tween(dur, fn) {
  const my = runId;
  return new Promise((res, rej) => {
    let t = 0, last = null;
    function f(ts) {
      if (my !== runId) return rej("restart");
      if (last === null) last = ts;
      if (!paused) t += (ts - last) * speed;
      last = ts;
      const p = Math.min(1, t / dur);
      fn(p);
      p < 1 ? requestAnimationFrame(f) : res();
    }
    requestAnimationFrame(f);
  });
}
const wait = ms => tween(ms, () => {});
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
function place(id, x, y) { $(id).setAttribute("transform", `translate(${x},${y})`); }
function show(id, x, y) { if (x !== undefined) place(id, x, y); $(id).classList.add("on"); }
function hide(id) { $(id).classList.remove("on"); }
function move(id, pts, dur) {
  const segs = []; let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); total += l; }
  show(id, pts[0][0], pts[0][1]);
  return tween(RM ? 1 : dur, p => {
    let d = ease(p) * total, i = 0;
    while (i < segs.length - 1 && d > segs[i]) { d -= segs[i]; i++; }
    const r = segs[i] ? d / segs[i] : 1;
    place(id, pts[i][0] + (pts[i + 1][0] - pts[i][0]) * r, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * r);
  });
}
function flash(t) { tableEls[t].classList.add("flash"); setTimeout(() => tableEls[t].classList.remove("flash"), 700); }
const on = id => $(id).classList.add("on"), off = id => $(id).classList.remove("on");
function fxOn(e) { e.classList.add("on"); }
function fxOff(e) { e.classList.remove("on"); }
const bg = p => p.catch(e => { if (e !== "restart") throw e; });

// progress follows the story clock
let LOOP = 36600;
let vt = 0, lastTs = null, storyStart = null;
function ticker(ts) {
  if (lastTs !== null && !paused) vt += (ts - lastTs) * speed;
  lastTs = ts;
  if (storyStart !== null) $("progress").setAttribute("width", Math.min(1, (vt - storyStart) / LOOP) * 1232);
  requestAnimationFrame(ticker);
}
requestAnimationFrame(ticker);

// ---------- one token through the graph ----------
// from: first point of the path from a file card to the start node; drive: this token sets node and edge states
async function ride(tok, from, delay, hopMs, holdMs, drive, hooks, holds) {
  if (delay) await wait(delay);
  await move(tok, [from, [207, from[1]], [207, GY], [N.r_start.x, GY]], 520);
  if (drive) node("r_start", "done");
  for (let i = 1; i < ORDER.length; i++) {
    const a = ORDER[i - 1], b = ORDER[i];
    if (drive) edge(a, b, "hot");
    await move(tok, [[N[a].x, GY], [N[b].x, GY]], hopMs);
    if (drive) edge(a, b, "done");
    if (b === "r_end") { if (drive) node(b, "done"); break; }
    hide(tok);
    if (drive) node(b, "active");
    const h = holds && holds[b] ? holds[b] : holdMs;
    if (hooks && hooks[b]) bg(hooks[b](h));
    await wait(h);
    if (drive) node(b, "done");
  }
  hide(tok);
}

// ---------- scene pieces ----------
function clearMatch() {
  [ext, pill, rule, resG, diffG, note].forEach(fxOff);
  extL.forEach(fxOff);
  led.forEach(r => { fxOff(r.label); r.cells.forEach(c => fxOff(c.g)); });
  dRows.forEach(d => fxOff(d.g));
  heads[0].textContent = HEAD[0];
  off("mclock");
}
function extractHook(line, text) {
  return async ms => {
    fxOn(ext); fxOn(pill); await wait(ms * .7); fxOff(pill);
    extL[line].textContent = text; fxOn(extL[line]);
  };
}
function fillOrder(c) {
  heads[0].textContent = "purchase order " + c.po;
  c.rows.forEach((r, i) => { led[i].label.textContent = r.sku; fxOn(led[i].label); setCell(i, 0, r.o, r.s.o === "dim" ? "dim" : "norm"); });
}
const fillDn = c => c.rows.forEach((r, i) => setCell(i, 1, r.d, r.s.d === "dim" ? "dim" : "norm"));
const fillInv = c => c.rows.forEach((r, i) => setCell(i, 2, r.i, "norm"));
function showResult(c) {
  const R = RES[c.result];
  resId.textContent = c.id;
  const w = R.label.length * 11 + 40;
  resRect.setAttribute("width", w); resRect.setAttribute("fill", R.color);
  resTxt.setAttribute("x", 372 + w / 2); resTxt.textContent = R.label;
  fxOn(resG);
  dRows.forEach(d => fxOff(d.g));
  fxOff(note);
  if (c.diffs.length) {
    c.diffs.forEach(([t, s], i) => {
      const d = dRows[i], w2 = t.length * 9 + 24;
      d.rect.setAttribute("width", w2); d.tt.setAttribute("x", 256 + w2 / 2); d.tt.textContent = t;
      d.tx.setAttribute("x", 256 + w2 + 16); d.tx.textContent = s; fxOn(d.g);
    });
  } else {
    note.textContent = c.result === "matched" ? "no differences: order, delivery note and invoice agree" : "no delivery note yet: the result stays open";
    note.style.fill = c.result === "matched" ? "#0F766E" : "#92400E"; fxOn(note);
  }
  fxOn(diffG);
}
async function matchScene(c) {
  fxOn(rule); await wait(450);
  if (c.awaiting) on("mclock");
  for (const col of [0, 1, 2]) {
    c.rows.forEach((r, i) => setCell(i, col, null, r.s["odi"[col]]));
    await wait(230);
  }
  await wait(200);
  showResult(c);
}
function storeInv(c) {
  flash("supplier_documents"); setChip(chips.inv, ("inv  " + c.inv.ext.split("  ")[1]).padEnd(16) + "linked", "ok"); fxOn(chips.inv);
  setTimeout(() => {
    flash("document_lines"); const r = c.rows.find(x => x.i !== "-") || c.rows[0];
    setChip(chips.line, r.sku + " " + r.i, "ok"); fxOn(chips.line);
  }, 220);
  setTimeout(() => {
    flash("reconciliations"); recRef.textContent = c.id;
    const R = RES[c.result];
    setChip(chips.rec, c.result, R.cls); fxOn(chips.rec);
    for (const d of c.diffs) counts[d[0]] = (counts[d[0]] || 0) + 1;
    if (c.diffs.length) flash("discrepancies");
    showCounts();
  }, 440);
}
const storeDn = (c, f) => { flash("supplier_documents"); setChip(chips.dn, ("dn   " + f.ext.split("  ")[1]).padEnd(16) + "linked", "ok"); fxOn(chips.dn); };
function addList(i, c) { const R = RES[c.result]; setChip(listChips[i], c.id + "  " + R.list, R.cls); fxOn(listChips[i]); }

// ---------- story ----------
function reset() {
  clearMatch(); resetGraph(); $("later").innerHTML = ""; $("files").innerHTML = "";
  document.querySelectorAll(".tok, .chip, .clock").forEach(e => e.classList.remove("on"));
  for (const t of TYPES) { counts[t] = 0; fxOn(tchips[t]); }
  showCounts();
  recRef.textContent = "";
  storyStart = vt; $("progress").setAttribute("width", 0);
}

async function runCase(c, k) {
  clearMatch(); resetGraph();
  for (const k2 of ["dn", "inv", "line", "rec"]) fxOff(chips[k2]);
  recRef.textContent = "";
  const files = c.dn ? [[c.dn, "delivery note"], [c.inv, "invoice"]] : [[c.inv, "invoice"]];
  setFiles(files); await wait(c.detail ? 500 : 250);
  const invSlot = c.dn ? 1 : 0;
  const fromDn = [109, SLOT[0]], fromInv = [109, SLOT[invSlot]];
  const dnHooks = c.dn ? { extract: extractHook(0, c.dn.ext), link: async () => { fillOrder(c); fillDn(c); }, store: async () => storeDn(c, c.dn) } : null;
  const invHooks = {
    extract: extractHook(c.dn ? 1 : 0, c.inv.ext),
    link: async () => { fillOrder(c); fillInv(c); },
    match: () => matchScene(c),
    store: async () => { storeInv(c); addList(k, c); },
  };
  if (c.detail) {
    markFile(0, true);
    await ride("tdn", fromDn, 0, 200, 170, true, dnHooks, { extract: 700 });
    markFile(0, false); markFile(1, true);
    resetGraph();
    await wait(100);
    await ride("tinv", fromInv, 0, 200, 170, true, invHooks, { extract: 700, match: 2000 });
    markFile(1, false);
  } else {
    markFile(invSlot, true); if (c.dn) markFile(0, true);
    const jobs = [ride("tinv", fromInv, c.dn ? 330 : 0, 150, 130, true, invHooks, { extract: 380, match: 1550 })];
    if (c.dn) jobs.unshift(ride("tdn", fromDn, 0, 150, 130, false, dnHooks, { extract: 380, match: 1550 }));
    await Promise.all(jobs);
  }
  await wait(c.awaiting ? 700 : 450);
}
async function secondScan() {
  const c = CASES[4];
  off("mclock");
  $("later").innerHTML = "";
  fileCard($("later"), 590, LATER, "delivery note");
  await wait(600);
  resetGraph();
  const hooks = {
    extract: async ms => { fxOn(ext); fxOn(pill); await wait(ms * .7); fxOff(pill); extL[0].textContent = LATER.ext; fxOn(extL[0]); },
    link: async () => setCell(0, 1, LATER.d, "norm"),
    match: async () => {
      const R = RES.matched, w = R.label.length * 11 + 40;
      await wait(150);
      [0, 1, 2].forEach(col => setCell(0, col, null, "ok"));
      await wait(400);
      resId.textContent = c.id; resRect.setAttribute("width", w); resRect.setAttribute("fill", R.color);
      resTxt.setAttribute("x", 372 + w / 2); resTxt.textContent = R.label;
      note.textContent = "same reconciliation INV-0011, completed - no second row"; note.style.fill = "#0F766E";
      dRows.forEach(d => fxOff(d.g)); fxOn(note);
    },
    store: async () => {
      storeDn(c, LATER);
      setTimeout(() => {
        flash("reconciliations"); setChip(chips.rec, "matched", "ok");
        setChip(listChips[4], c.id + "  matched", "ok"); fxOn(listChips[4]);
      }, 250);
    },
  };
  extL[1].textContent = ""; fxOff(extL[1]); fxOff(extL[0]);
  await ride("tdn", [109, 590], 0, 200, 170, true, hooks, { extract: 600, match: 1900 });
  await wait(500);
}

async function story() {
  reset();
  await wait(300);
  for (let k = 0; k < CASES.length; k++) await runCase(CASES[k], k);
  await secondScan();
  window.lastStoryMs = vt - storyStart;
  $("progress").setAttribute("width", 1232); storyStart = null;
  await wait(3500);
}
async function loop() {
  const my = ++runId;
  try { while (my === runId) await story(); } catch (e) { if (e !== "restart") throw e; }
}
$("btn-pause").onclick = () => { paused = !paused; $("btn-pause").textContent = paused ? "Play" : "Pause"; };
$("btn-restart").onclick = () => { paused = false; $("btn-pause").textContent = "Pause"; loop(); };
$("btn-speed").onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; $("btn-speed").textContent = "Speed " + speed + "x"; };
$("btn-clean").onclick = () => document.body.classList.toggle("clean");
if (location.hash === "#clean") document.body.classList.add("clean");
loop();
</script>
