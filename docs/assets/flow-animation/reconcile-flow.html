<title>Reconcile Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap">
<style>
/* Layout: one fixed 16:9 stage (GIF-ready) - three documents | extract | compare table | decision | register or claim subgraph | end. Single deliberate light, high-contrast look, independent of the OS theme. */
:root {
  --ground: #EDF1F7;
  --panel: #FFFFFF;
  --panel-edge: #B9C4D4;
  --ink: #0F172A;
  --muted: #475569;
  --line: #8A99AF;
  --node-edge: #5B6B82;
  --active: #7C3AED;
  --title: #4338CA;
  --done: #0D9488;
  --done-soft: #CCFBF1;
  --done-ink: #134E4A;
  --bad: #E11D48;
  --bad-soft: #FFE4E6;
  --bad-ink: #9F1239;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --sans: "Inter", system-ui, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { background: var(--ground); color: var(--ink); }
body { font-family: var(--sans); padding-block: 16px; padding-inline: 16px; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 10px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 600 14px/1.3 var(--mono); letter-spacing: .02em; margin: 0; text-wrap: balance; color: var(--title); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: 500 12px var(--mono); color: var(--ink); background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button:hover { border-color: var(--active); color: var(--title); }
button:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
.stage { overflow-x: auto; }
svg { display: block; width: 100%; min-width: 0; height: auto; background: var(--ground); }
body.clean header { display: none; }

/* nodes: idle white, active violet, done teal, failed rose */
.node .sh { fill: #fff; stroke: var(--node-edge); stroke-width: 1.6; transition: fill .3s, stroke .3s, stroke-width .3s; filter: url(#shadow); }
.node .lb { font: 700 17px var(--sans); fill: var(--ink); text-anchor: middle; dominant-baseline: central; transition: fill .3s; }
.node.active .sh { fill: var(--active); stroke: var(--active); stroke-width: 3; filter: url(#glow); }
.node.active .lb { fill: #fff; }
.node.done .sh { fill: var(--done-soft); stroke: var(--done); stroke-width: 2.2; }
.node.done .lb { fill: var(--done-ink); }
.node.bad .sh { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 2.2; }
.node.bad .lb { fill: var(--bad-ink); }
/* the compare node is a frame around the table: it keeps a light fill while active */
.node.big .sh { fill: var(--panel); }
.node.big.active .sh { fill: #F5F3FF; }
.node.big .lb { text-anchor: start; font-size: 18px; }
.node.big.active .lb { fill: var(--active); }

.edge { fill: none; stroke: var(--line); stroke-width: 2; transition: stroke .3s; }
.edge.hot { stroke: var(--active); stroke-width: 3; stroke-dasharray: 9 5; animation: flow .45s linear infinite; filter: url(#glow-e); }
@keyframes flow { to { stroke-dashoffset: -14; } }
.edge.ok { stroke: var(--done); stroke-width: 3; }
.edge.bad { stroke: var(--bad); stroke-width: 3; }
@media (prefers-reduced-motion: reduce) { .edge.hot { animation: none; } }
.blab { font: 700 16px var(--sans); fill: var(--line); transition: fill .3s; }
.blab.ok { fill: var(--done); }
.blab.bad { fill: var(--bad); }

.card .sh { fill: #fff; stroke: var(--panel-edge); stroke-width: 1.6; filter: url(#shadow); transition: stroke .3s, stroke-width .3s; }
.card.on .sh { stroke: var(--active); stroke-width: 3; }
.card .nm { font: 700 17px var(--sans); fill: var(--ink); dominant-baseline: central; }
.card .fg { font: 600 16px var(--mono); fill: var(--ink); dominant-baseline: central; opacity: 0; transition: opacity .3s; }
.card.on .fg, .card.kept .fg { opacity: 1; }

.cell rect { fill: #F8FAFC; stroke: var(--panel-edge); stroke-width: 1.4; transition: fill .3s, stroke .3s; }
.cell text { font: 600 18px var(--mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.cell.ok rect { fill: #F0FDFA; stroke: var(--done); stroke-width: 2.6; }
.cell.ok text { fill: var(--done-ink); }
.cell.bad rect { fill: #FFF1F2; stroke: var(--bad); stroke-width: 3; }
.cell.bad text { fill: var(--bad-ink); }
.mark { opacity: 0; transition: opacity .3s; }
.cell.ok .mk-ok, .cell.bad .mk-bad { opacity: 1; }
.th { font: 700 15px var(--sans); fill: var(--muted); text-anchor: middle; }
.rh { font: 700 15px var(--sans); fill: var(--ink); dominant-baseline: central; }

#claimG { opacity: .32; transition: opacity .5s; }
#claimG.lit { opacity: 1; }
.cframe { fill: #FFFFFF; fill-opacity: .55; stroke: var(--node-edge); stroke-width: 1.6; stroke-dasharray: 7 5; }
#claimG.lit .cframe { stroke: var(--bad); }
.clab { font: 700 16px var(--sans); fill: var(--muted); }
#claimG.lit .clab { fill: var(--bad-ink); }
.diff { font: 700 17px var(--mono); fill: var(--bad); text-anchor: middle; dominant-baseline: central; opacity: 0; transition: opacity .3s; }
.diff.on { opacity: 1; }
.node.active .diff { fill: #fff; }

.fly { opacity: 0; }
.fly.on { opacity: 1; }
.fly text { font: 700 14px var(--mono); fill: #fff; text-anchor: middle; dominant-baseline: central; white-space: pre; }
.tag rect { fill: var(--title); }
.tag text { font: 700 16px var(--sans); fill: #fff; text-anchor: middle; dominant-baseline: central; }
.progress { fill: url(#prog); }
</style>

<div class="wrap">
  <header>
    <h1 id="h1"></h1>
    <div class="controls">
      <button id="btn-pause" type="button"></button>
      <button id="btn-restart" type="button"></button>
      <button id="btn-speed" type="button"></button>
      <button id="btn-clean" type="button"></button>
    </div>
  </header>
  <div class="stage">
  <svg id="svg" viewBox="0 0 1280 720" role="img">
    <defs>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#EDF1F7"/><circle cx="12" cy="12" r="1.1" fill="#D3DAE5"/></pattern>
      <linearGradient id="prog" x1="0" x2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset=".5" stop-color="#0891B2"/><stop offset="1" stop-color="#0D9488"/></linearGradient>
      <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E293B" flood-opacity=".14"/></filter>
      <filter id="glow" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/><feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-e" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720"><feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A99AF"/></marker>
      <marker id="arr-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
      <marker id="arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker>
      <marker id="arr-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E11D48"/></marker>
    </defs>

    <rect width="1280" height="720" fill="url(#dots)"/>
    <g id="edges"></g>
    <g id="cards"></g>
    <g id="nodes"></g>
    <g id="claimG"></g>
    <g id="flys"></g>
    <g id="tagG" class="tag"><rect x="24" y="22" width="132" height="34" rx="17"/><text id="tag" x="90" y="39.5"></text></g>

    <rect x="24" y="704" width="1232" height="4" rx="2" fill="#D5DCE6"/>
    <rect class="progress" id="progress" x="24" y="704" width="0" height="4" rx="2"/>
  </svg>
  </div>
</div>

<script>
// ---------- every visible string (the Spanish page differs only in this block, the charset and the <title>) ----------
const S = {
  h1: "reconciliation - order, delivery note and invoice: extract, compare, then register or claim",
  aria: "Animated reconciliation graph in two rounds: the quantity, price and total of the order, the delivery note and the invoice are extracted and compared; in round 1 everything matches and the invoice is registered; in round 2 the invoice charges 40 units when the delivery note shows 35, so the claim subgraph computes a difference of -25.00 EUR and asks the supplier for a credit",
  btn: { pause: "Pause", play: "Play", restart: "Restart", speed: "Speed", clean: "Clean frame" },
  round: ["Round 1", "Round 2"],
  docs: ["Order", "Delivery note", "Invoice"],
  cols: ["Quantity", "Price", "Total"],
  nodes: { extract: "Extract", compare: "Compare", decide: "Match?", register: "Register", compute: "Compute difference", ask: "Ask for credit", end: "End" },
  claim: "Claim", yes: "yes", no: "no",
  figs: [[["100", "4.20", "420.00"], ["100", "4.20", "420.00"], ["100", "4.20", "420.00"]],
         [["40", "5.00", "200.00"], ["35", "5.00", "175.00"], ["40", "5.00", "200.00"]]],
  diff: "-25.00 EUR",
};
</script>
<script>
const SVGNS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const el = (tag, attrs, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (attrs, s, parent) => { const e = el("text", attrs, parent); e.textContent = s; return e; };

$("h1").textContent = S.h1; $("svg").setAttribute("aria-label", S.aria);
$("btn-pause").textContent = S.btn.pause; $("btn-restart").textContent = S.btn.restart;
$("btn-speed").textContent = S.btn.speed + " 1x"; $("btn-clean").textContent = S.btn.clean;

// ---------- timeline (ms): one node active at a time, every step held at least 1.5 s (change 017 redesign) ----------
const T = {
  cards: 1600, extract: 3000, compare: [2800, 3400], decide: 1600,
  register: 1800, compute: 2400, ask: 2000, end: 1600, hold: 2000,
  fly: 1300, flyGap: 700, edge: 450,
};

// ---------- layout ----------
const Y = 360;
const CARD = { x: 16, w: 164, h: 104, cy: [216, 360, 504] };
const EX = { x: 270, w: 112, h: 54 };
const CMP = { x: 374, y: 196, w: 442, h: 278 };
const COLX = [500, 602, 704], CW = 96, CH = 48, ROWY = [304, 364, 424];
const DEC = { x: 905, hw: 60, hh: 48 };
const REG = { x: 1075, y: 220, w: 162, h: 54 };
const CLM = { x: 973, y: 452, w: 214, h: 234 };
const CMPN = { x: 1080, y: 534, w: 190, h: 70 };
const ASK = { x: 1080, y: 636, w: 190, h: 50 };
const END = { x: 1232, r: 26 };

// ---------- edges ----------
const EG = $("edges");
const edges = {};
function edge(id, d) { edges[id] = el("path", { class: "edge", d, "marker-end": "url(#arr)" }, EG); }
CARD.cy.forEach((cy, i) => edge("c" + i, `M${CARD.x + CARD.w},${cy} C${CARD.x + CARD.w + 22},${cy} ${EX.x - EX.w / 2 - 24},${Y} ${EX.x - EX.w / 2 - 2},${Y}`));
edge("ex-cmp", `M${EX.x + EX.w / 2},${Y} L${CMP.x - 2},${Y}`);
edge("cmp-dec", `M${CMP.x + CMP.w},${Y} L${DEC.x - DEC.hw - 2},${Y}`);
edge("yes", `M${DEC.x},${Y - DEC.hh} L${DEC.x},${REG.y} L${REG.x - REG.w / 2 - 2},${REG.y}`);
edge("no", `M${DEC.x},${Y + DEC.hh} L${DEC.x},${CMPN.y} L${CMPN.x - CMPN.w / 2 - 2},${CMPN.y}`);
edge("reg-end", `M${REG.x + REG.w / 2},${REG.y} L${END.x},${REG.y} L${END.x},${Y - END.r - 2}`);
edge("cmpn-ask", `M${CMPN.x},${CMPN.y + CMPN.h / 2} L${CMPN.x},${ASK.y - ASK.h / 2 - 2}`);
edge("ask-end", `M${ASK.x + ASK.w / 2},${ASK.y} L${END.x},${ASK.y} L${END.x},${Y + END.r + 2}`);
const MARK = { hot: "url(#arr-hot)", ok: "url(#arr-ok)", bad: "url(#arr-bad)" };
function setEdge(id, state) {
  const e = edges[id]; e.classList.remove("hot", "ok", "bad"); if (state) e.classList.add(state);
  e.setAttribute("marker-end", MARK[state] || "url(#arr)");
}
const yesLab = txt({ class: "blab", x: DEC.x - 12, y: 286, "text-anchor": "end" }, S.yes, EG);
const noLab = txt({ class: "blab", x: DEC.x - 12, y: 462, "text-anchor": "end" }, S.no, EG);

// ---------- document cards ----------
const cards = CARD.cy.map((cy, i) => {
  const g = el("g", { class: "card" }, $("cards"));
  el("rect", { class: "sh", x: CARD.x, y: cy - CARD.h / 2, width: CARD.w, height: CARD.h, rx: 10 }, g);
  const ix = CARD.x + 14, iy = cy - 40;
  el("path", { d: `M${ix},${iy} h11 l5,5 v16 h-16 z`, fill: "none", stroke: "#4338CA", "stroke-width": 1.6 }, g);
  txt({ class: "nm", x: ix + 26, y: iy + 11 }, S.docs[i], g);
  const f1 = txt({ class: "fg", x: CARD.x + 16, y: cy + 8 }, "", g);
  const f2 = txt({ class: "fg", x: CARD.x + 16, y: cy + 34 }, "", g);
  return { g, f1, f2 };
});

// ---------- nodes ----------
const NG = $("nodes"), CG = $("claimG");
const nodes = {};
function rectNode(k, c, parent) {
  const g = el("g", { class: "node" }, parent);
  el("rect", { class: "sh", x: c.x - c.w / 2, y: (c.y ?? Y) - c.h / 2, width: c.w, height: c.h, rx: 10 }, g);
  nodes[k] = g;
  return g;
}
txt({ class: "lb", x: EX.x, y: Y }, S.nodes.extract, rectNode("extract", EX, NG));
{
  const g = el("g", { class: "node big" }, NG);
  el("rect", { class: "sh", x: CMP.x, y: CMP.y, width: CMP.w, height: CMP.h, rx: 12 }, g);
  txt({ class: "lb", x: CMP.x + 16, y: CMP.y + 26 }, S.nodes.compare, g);
  nodes.compare = g;
}
{
  const g = el("g", { class: "node" }, NG);
  el("polygon", { class: "sh", points: `${DEC.x},${Y - DEC.hh} ${DEC.x + DEC.hw},${Y} ${DEC.x},${Y + DEC.hh} ${DEC.x - DEC.hw},${Y}` }, g);
  txt({ class: "lb", x: DEC.x, y: Y, style: "font-size:16px" }, S.nodes.decide, g);
  nodes.decide = g;
}
txt({ class: "lb", x: REG.x, y: REG.y }, S.nodes.register, rectNode("register", REG, NG));
{
  const g = el("g", { class: "node" }, NG);
  el("circle", { class: "sh", cx: END.x, cy: Y, r: END.r }, g);
  txt({ class: "lb", x: END.x, y: Y, style: "font-size:15px" }, S.nodes.end, g);
  nodes.end = g;
}
// claim subgraph: framed, dimmed until the no branch lights in round 2
el("rect", { class: "cframe", x: CLM.x, y: CLM.y, width: CLM.w, height: CLM.h, rx: 12 }, CG);
txt({ class: "clab", x: CLM.x + 14, y: CLM.y + 24 }, S.claim, CG);
const cmpnG = rectNode("compute", CMPN, CG);
txt({ class: "lb", x: CMPN.x, y: CMPN.y - 14, style: "font-size:16px" }, S.nodes.compute, cmpnG);
const diffTx = txt({ class: "diff", x: CMPN.x, y: CMPN.y + 15 }, S.diff, cmpnG);
txt({ class: "lb", x: ASK.x, y: ASK.y, style: "font-size:16px" }, S.nodes.ask, rectNode("ask", ASK, CG));
function setNode(k, state) { const g = nodes[k]; g.classList.remove("active", "done", "bad"); if (state) g.classList.add(state); }

// ---------- compare table ----------
const TG = nodes.compare;
S.cols.forEach((c, j) => txt({ class: "th", x: COLX[j] + CW / 2, y: 266 }, c, TG));
S.docs.forEach((d, i) => txt({ class: "rh", x: CMP.x + 16, y: ROWY[i] }, d, TG));
const CHECK = "M-4.5,0.5 L-1.5,3.5 L4.5,-3.5", CROSS = "M-3.5,-3.5 L3.5,3.5 M3.5,-3.5 L-3.5,3.5";
const cells = ROWY.map(y => COLX.map(x => {
  const g = el("g", { class: "cell" }, TG);
  el("rect", { x, y: y - CH / 2, width: CW, height: CH, rx: 8 }, g);
  const t = txt({ x: x + CW / 2 - 8, y: y + 1 }, "", g);
  const mx = x + CW - 13, my = y - CH / 2 + 13;
  const ok = el("g", { class: "mark mk-ok", transform: `translate(${mx},${my})` }, g);
  el("circle", { r: 9, fill: "#0D9488" }, ok); el("path", { d: CHECK, fill: "none", stroke: "#fff", "stroke-width": 2.4, "stroke-linecap": "round", "stroke-linejoin": "round" }, ok);
  const bad = el("g", { class: "mark mk-bad", transform: `translate(${mx},${my})` }, g);
  el("circle", { r: 9, fill: "#E11D48" }, bad); el("path", { d: CROSS, fill: "none", stroke: "#fff", "stroke-width": 2.4, "stroke-linecap": "round" }, bad);
  return { g, t };
}));
function setCell(i, j, state) { const c = cells[i][j]; c.g.classList.remove("ok", "bad"); if (state) c.g.classList.add(state); }

// ---------- figures that fly from each card through extract into its table row ----------
const flys = CARD.cy.map(() => {
  const g = el("g", { class: "fly" }, $("flys"));
  const r = el("rect", { y: -15, height: 30, rx: 15, fill: "#7C3AED" }, g);
  const t = txt({ x: 0, y: 1 }, "", g);
  return { g, r, t };
});

// ---------- timeline engine ----------
let runId = 0, paused = false, speed = 1;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
function tween(dur, fn) {
  const my = runId;
  return new Promise((res, rej) => {
    let t = 0, last = null;
    function f(ts) {
      if (my !== runId) return rej("restart");
      if (last === null) last = ts;
      if (!paused) t += (ts - last) * speed;
      last = ts;
      const p = Math.min(1, t / dur);
      fn(p);
      p < 1 ? requestAnimationFrame(f) : res();
    }
    requestAnimationFrame(f);
  });
}
const wait = ms => tween(ms, () => {});
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const bg = p => p.catch(e => { if (e !== "restart") throw e; });
function move(g, pts, dur) {
  const segs = []; let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); total += l; }
  const place = (x, y) => g.setAttribute("transform", `translate(${x},${y})`);
  place(pts[0][0], pts[0][1]); g.classList.add("on");
  return tween(RM ? 1 : dur, p => {
    let d = ease(p) * total, i = 0;
    while (i < segs.length - 1 && d > segs[i]) { d -= segs[i]; i++; }
    const r = segs[i] ? d / segs[i] : 1;
    place(pts[i][0] + (pts[i + 1][0] - pts[i][0]) * r, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * r);
  });
}
// an edge pulses while the flow crosses it, then keeps the colour of the outcome
async function cross(id, after) { setEdge(id, "hot"); await wait(T.edge); setEdge(id, after); }

// progress follows the story clock; LOOP is the story length of one pass as measured by record.py (lastStoryMs)
const LOOP = 28650;
let vt = 0, lastTs = null, storyStart = null;
function ticker(ts) {
  if (lastTs !== null && !paused) vt += (ts - lastTs) * speed;
  lastTs = ts;
  if (storyStart !== null) $("progress").setAttribute("width", Math.min(1, (vt - storyStart) / LOOP) * 1232);
  requestAnimationFrame(ticker);
}
requestAnimationFrame(ticker);

// ---------- one round ----------
function resetRound(r) {
  for (const k in nodes) setNode(k, null);
  for (const k in edges) setEdge(k, null);
  yesLab.setAttribute("class", "blab"); noLab.setAttribute("class", "blab");
  $("claimG").classList.remove("lit"); diffTx.classList.remove("on");
  cards.forEach(c => c.g.classList.remove("on", "kept"));
  cells.forEach(row => row.forEach(c => { c.t.textContent = ""; c.g.classList.remove("ok", "bad"); }));
  flys.forEach(f => f.g.classList.remove("on"));
  $("tag").textContent = S.round[r];
}
// a step: the incoming edge pulses while the node turns active, and the node stays active for the whole hold
async function step(k, ms, end, body, inEdge, edgeEnd = "ok") {
  setNode(k, "active");
  if (inEdge) bg(cross(inEdge, edgeEnd));
  await Promise.all([wait(ms), body ? body() : null]);
  setNode(k, end);
}
async function round(r) {
  const F = S.figs[r], bad = r === 1;
  resetRound(r);
  // the three documents light up and show their figures
  for (let i = 0; i < 3; i++) {
    cards[i].f1.textContent = F[i][0] + " x " + F[i][1];
    cards[i].f2.textContent = "= " + F[i][2];
  }
  for (let i = 0; i < 3; i++) { cards[i].g.classList.add("on"); await wait(T.cards / 3); }
  // extract: each document's figures fly through the extract node into its row
  await step("extract", T.extract, "done", async () => {
    await Promise.all([0, 1, 2].map(async i => {
      await wait(i * T.flyGap);
      bg(cross("c" + i, "ok"));
      const f = flys[i], label = F[i].join("  ");
      f.t.textContent = label;
      const w = f.t.getComputedTextLength() + 28;
      f.r.setAttribute("x", -w / 2); f.r.setAttribute("width", w);
      cards[i].g.classList.replace("on", "kept");
      await move(f.g, [[CARD.x + CARD.w - 30, CARD.cy[i]], [EX.x, Y], [COLX[1] + CW / 2, ROWY[i]]], T.fly);
      f.g.classList.remove("on");
      F[i].forEach((v, j) => { cells[i][j].t.textContent = v; });
    }));
  });
  // compare: column by column; in round 2 the invoice quantity and total fail against the delivery note
  await step("compare", T.compare[r], "done", async () => {
    await wait(300);
    for (const j of bad ? [1, 0, 2] : [0, 1, 2]) {
      for (let i = 0; i < 3; i++) {
        if (bad && j !== 1 && i === 0) continue;
        setCell(i, j, bad && j !== 1 && i === 2 ? "bad" : "ok");
        await wait(140);
      }
      await wait(bad ? 520 : 400);
    }
  }, "ex-cmp");
  // decision: the yes branch to register, or the no branch into the claim subgraph
  await step("decide", T.decide, bad ? "bad" : "done", async () => {
    await wait(500);
    (bad ? noLab : yesLab).setAttribute("class", "blab " + (bad ? "bad" : "ok"));
    if (bad) $("claimG").classList.add("lit");
  }, "cmp-dec");
  if (!bad) {
    await step("register", T.register, "done", null, "yes");
  } else {
    await step("compute", T.compute, "bad", async () => { await wait(600); diffTx.classList.add("on"); }, "no", "bad");
    await step("ask", T.ask, "bad", null, "cmpn-ask", "bad");
  }
  await step("end", T.end, "done", null, bad ? "ask-end" : "reg-end", bad ? "bad" : "ok");
}

// ---------- story ----------
async function story() {
  storyStart = vt; $("progress").setAttribute("width", 0);
  await round(0);
  await round(1);
  window.lastStoryMs = vt - storyStart;
  $("progress").setAttribute("width", 1232); storyStart = null;
  await wait(T.hold);
}
async function loop() {
  const my = ++runId;
  try { while (my === runId) await story(); } catch (e) { if (e !== "restart") throw e; }
}
$("btn-pause").onclick = () => { paused = !paused; $("btn-pause").textContent = paused ? S.btn.play : S.btn.pause; };
$("btn-restart").onclick = () => { paused = false; $("btn-pause").textContent = S.btn.pause; loop(); };
$("btn-speed").onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; $("btn-speed").textContent = S.btn.speed + " " + speed + "x"; };
$("btn-clean").onclick = () => document.body.classList.toggle("clean");
if (location.hash === "#clean") document.body.classList.add("clean");
loop();
</script>
