<meta charset="utf-8">
<title>Flujo de conciliación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap">
<style>
/* Layout: one fixed 16:9 stage (GIF-ready) - reconciliation graph (three documents, extract, compare with its table, decision, register or claim subgraph) | supplier. Visual style of the orders animation (purchase-cycle-flow.html). Single deliberate light, high-contrast look, independent of the OS theme. */
:root {
  --ground: #EDF1F7;
  --panel: #FFFFFF;
  --panel-edge: #B9C4D4;
  --ink: #0F172A;
  --muted: #475569;
  --line: #8A99AF;
  --node: #FFFFFF;
  --node-edge: #5B6B82;
  --active: #0891B2;
  --title: #4338CA;
  --done: #0D9488;
  --done-soft: #CCFBF1;
  --done-ink: #134E4A;
  --msg: #D97706;
  --msg-soft: #FEF3C7;
  --hot: #F59E0B;
  --hot-ink: #1C1300;
  --bad: #E11D48;
  --bad-ink: #9F1239;
  --idle: #F4F6FA;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --sans: "Inter", system-ui, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { background: var(--ground); color: var(--ink); }
body { font-family: var(--sans); padding-block: 16px; padding-inline: 16px; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 10px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 600 14px/1.3 var(--mono); letter-spacing: .02em; margin: 0; text-wrap: balance; color: var(--title); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: 500 12px var(--mono); color: var(--ink); background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button:hover { border-color: var(--active); color: var(--title); }
button:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
.stage { overflow-x: auto; }
svg { display: block; width: 100%; min-width: 0; height: auto; background: var(--ground); }
body.clean header { display: none; }

.frame { fill: var(--panel); stroke: var(--panel-edge); stroke-width: 1.2; filter: url(#shadow); }
.subframe { fill: var(--idle); stroke: var(--node-edge); stroke-dasharray: 4 4; transition: fill .4s, stroke .4s; }
.subframe.open { fill: #ECFEFF; stroke: var(--active); stroke-width: 1.6; }
.flabel { font: 700 12px var(--mono); fill: var(--title); letter-spacing: .16em; text-transform: uppercase; }
.small { font: 400 12px var(--mono); fill: var(--muted); }
.cond { font: 700 12px var(--mono); fill: var(--ink); }
.pname { font: 600 14px var(--sans); fill: var(--ink); text-anchor: middle; }

/* nodes: idle white, active solid amber with glow, done teal (as in the orders animation) */
.node rect { fill: var(--node); stroke: var(--node-edge); stroke-width: 1.4; transition: fill .3s, stroke .3s; }
.node text { font: 600 13px var(--mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; transition: fill .3s; }
.node circle { fill: var(--node); stroke: var(--muted); stroke-width: 1.6; transition: fill .3s, stroke .3s; }
.node.endc circle.dot { fill: var(--muted); stroke: none; }
.node.active rect { fill: var(--hot); stroke: var(--hot); filter: url(#glow); }
.node.active text { fill: var(--hot-ink); font-weight: 700; }
.node.active circle { stroke: var(--hot); }
.node.active circle.dot { fill: var(--hot); }
.node.done rect { fill: var(--done-soft); stroke: var(--done); stroke-width: 1.8; }
.node.done text { fill: var(--done-ink); }
.node.done circle { stroke: var(--done); }
.node.done circle.dot { fill: var(--done); }
.idle { opacity: .45; transition: opacity .4s; }
.lit { opacity: 1; transition: opacity .4s; }

.edge { fill: none; stroke: var(--line); stroke-width: 1.6; transition: stroke .3s; }
.edge.hot { stroke: var(--hot); stroke-width: 2.6; stroke-dasharray: 9 5; animation: flow .45s linear infinite; filter: url(#glow-e); }
@keyframes flow { to { stroke-dashoffset: -14; } }
.edge.done { stroke: var(--done); stroke-opacity: .9; stroke-width: 2; }
.link { stroke: var(--node-edge); stroke-dasharray: 3 4; fill: none; }
@media (prefers-reduced-motion: reduce) { .edge.hot { animation: none; } }

/* compare table: rows are the three documents, columns quantity, price and total */
.table rect.t { fill: #F8FAFC; stroke: var(--panel-edge); transition: stroke .3s; }
.table.flash rect.t { stroke: var(--hot); stroke-width: 2; filter: url(#glow-s); }
.th { font: 700 12px var(--mono); fill: var(--muted); text-anchor: middle; }
.rh { font: 700 12px var(--mono); fill: var(--ink); dominant-baseline: central; }
.cell rect { fill: #FFFFFF; stroke: var(--panel-edge); stroke-width: 1.2; transition: fill .3s, stroke .3s; }
.cell text { font: 600 15px var(--mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.cell.ok rect { fill: var(--done-soft); stroke: var(--done); stroke-width: 1.8; }
.cell.ok text { fill: var(--done-ink); }
.cell.bad rect { fill: #FFE4E6; stroke: var(--bad); stroke-width: 2.2; }
.cell.bad text { fill: var(--bad-ink); }
.mark { opacity: 0; transition: opacity .3s; }
.cell.ok .mk-ok, .cell.bad .mk-bad { opacity: 1; }

.chip { opacity: 0; transition: opacity .4s; }
.chip.on { opacity: 1; }
.chip text { font: 600 13px var(--mono); fill: var(--ink); dominant-baseline: central; white-space: pre; }
.tok { opacity: 0; transition: opacity .25s; filter: url(#glow-t); }
.tok.on { opacity: 1; }
.tok text { font: 700 14px var(--mono); fill: var(--hot-ink); text-anchor: middle; dominant-baseline: central; white-space: pre; }
.check { opacity: 0; transition: opacity .3s; filter: url(#glow-s); }
.check.on { opacity: 1; }
.mail { opacity: 0; transition: opacity .4s; }
.mail.on { opacity: 1; }
.mline { font: 600 14px var(--sans); fill: var(--ink); }
.mline.diff { font-weight: 700; fill: var(--bad); }
.tag rect { fill: var(--title); }
.tag text { font: 700 12px var(--mono); fill: #fff; text-anchor: middle; dominant-baseline: central; letter-spacing: .08em; }
.progress { fill: url(#prog); }
</style>

<div class="wrap">
  <header>
    <h1 id="h1"></h1>

      <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1E293B" flood-opacity=".14"/></filter>
      <filter id="glow" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/><feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/><feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope=".6"/></feComponentTransfer><feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-t" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/><feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope=".4"/></feComponentTransfer><feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-e" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720"><feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A99AF"/></marker>
      <marker id="arr-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/></marker>

    </defs>

    <rect width="1280" height="720" fill="url(#dots)"/>
    <!-- reconciliation graph and supplier panels -->
    <rect class="frame" x="24" y="64" width="848" height="616" rx="10"/>

    <circle cx="1076" cy="150" r="22" fill="#E2E8F0" stroke="#8A99AF"/>
    <path d="M1062,164 V146 L1076,136 L1090,146 V164 Z" fill="#64748B"/>
    <rect x="1071" y="153" width="10" height="11" fill="#E2E8F0"/>

    <g id="claimG" class="idle">
      <rect class="subframe" id="subframe" x="40" y="436" width="816" height="228" rx="8"/>
      <text class="flabel" id="claimLab" x="52" y="456"></text>
    </g>
    <g id="yesG"></g>
    <g id="edges"></g>
    <g id="tables"></g>
    <g id="nodes"></g>
    <g id="toks"></g>
    <g id="mailG" class="mail"></g>
    <g id="tagG" class="tag"><rect x="756" y="74" width="104" height="24" rx="12"/><text id="tag" x="808" y="86.5"></text></g>

    <rect x="24" y="704" width="1232" height="4" rx="2" fill="#D5DCE6"/>
    <rect class="progress" id="progress" x="24" y="704" width="0" height="4" rx="2"/>
  </svg>
  </div>
</div>

<script>
// ---------- every visible string (the English page differs only in this block, the charset and the <title>) ----------
const S = {
  h1: "conciliación - pedido, albarán y factura: extraer, comparar y después registrar o reclamar al proveedor",
  aria: "Grafo de conciliación animado en dos rondas: se extraen y comparan la cantidad, el precio y el total del pedido, el albarán y la factura; en la ronda 1 todo cuadra y la factura se registra; en la ronda 2 la factura cobra 40 unidades cuando el albarán muestra 35, así que el subgrafo de reclamación calcula una diferencia de -25,00 €, redacta un correo, una persona lo aprueba y se envía al proveedor pidiendo un abono",
  btn: { pause: "Pausa", play: "Reanudar", restart: "Reiniciar", speed: "Velocidad", clean: "Fotograma limpio" },
  graph: "grafo de conciliación", supPanel: "proveedor", supplier: "Proveedor",
  round: ["Ronda 1", "Ronda 2"],
  docs: ["Pedido", "Albarán", "Factura"],
  cols: ["Cantidad", "Precio", "Total"],
  nodes: { extract: "Extraer", compare: "Comparar", decide: "¿Cuadra?", register: "Registrar", compute: "Calcular diferencia", draft: "Redactar correo", approve: "Aprobar", send: "Enviar", end: "Fin" },
  claim: "reclamación", yes: "Sí", no: "No", person: "persona",
  figs: [[["100", "4,20", "420,00"], ["100", "4,20", "420,00"], ["100", "4,20", "420,00"]],
         [["40", "5,00", "200,00"], ["35", "5,00", "175,00"], ["40", "5,00", "200,00"]]],
  diff: "-25,00 €",
  mail: ["Factura 40 uds · Albarán 35 uds", "Diferencia -25,00 €", "Solicitamos un abono"],
};
</script>
<script>
const SVGNS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const el = (tag, attrs, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (attrs, s, parent) => { const e = el("text", attrs, parent); e.textContent = s; return e; };

$("h1").textContent = S.h1; $("svg").setAttribute("aria-label", S.aria);
$("btn-pause").textContent = S.btn.pause; $("btn-restart").textContent = S.btn.restart;
$("btn-speed").textContent = S.btn.speed + " 1x"; $("btn-clean").textContent = S.btn.clean;
$("graphLab").textContent = S.graph; $("supLab").textContent = S.supPanel; $("supName").textContent = S.supplier;
$("claimLab").textContent = S.claim;

// ---------- timeline (ms): one node active at a time, every step held at least 1.5 s (change 017, orders style) ----------
const T = {
  docs: 1600, extract: 3000, compare: [2800, 3400], decide: 1600, register: 1800,
  compute: 2400, draft: 2000, approve: 2000, send: 3000, end: 1600, hold: 2000,
  fly: 1300, flyGap: 700, edge: 450, mail: 1300,
};

// ---------- graph layout (orders style: 38 px nodes, mono labels) ----------
const NH = 38;
const N = {
  doc0: { x: 104, y: 136, w: 128 }, doc1: { x: 104, y: 180, w: 128 }, doc2: { x: 104, y: 224, w: 128 },
  extract: { x: 260, y: 180, w: 100 }, compare: { x: 400, y: 180, w: 110 }, decide: { x: 600, y: 180, w: 110 },
  register: { x: 750, y: 180, w: 110, g: "yesG" }, end1: { x: 845, y: 180, c: 1, g: "yesG" },
  compute: { x: 150, y: 528, w: 196, g: "claimG" }, draft: { x: 360, y: 528, w: 164, g: "claimG" },
  approve: { x: 540, y: 528, w: 110, g: "claimG" }, send: { x: 710, y: 528, w: 110, g: "claimG" },
  end2: { x: 710, y: 618, c: 1, g: "claimG" },
};
const LABEL = { doc0: S.docs[0], doc1: S.docs[1], doc2: S.docs[2], end1: S.nodes.end, end2: S.nodes.end };
const E = {
  c0: [[168, 136], [186, 136], [186, 180], [208, 180]],
  c1: [[168, 180], [208, 180]],
  c2: [[168, 224], [186, 224], [186, 180], [208, 180]],
  "ex-cmp": [[310, 180], [343, 180]],
  "cmp-dec": [[455, 180], [543, 180]],
  yes: [[655, 180], [693, 180], "yesG"],
  "reg-end": [[805, 180], [834, 180], "yesG"],
  no: [[600, 199], [600, 420], [150, 420], [150, 507]],
  "cd-dr": [[248, 528], [276, 528], "claimG"],
  "dr-ap": [[442, 528], [483, 528], "claimG"],
  "ap-se": [[595, 528], [653, 528], "claimG"],
  "se-end": [[710, 547], [710, 607], "claimG"],
  "se-sup": [[765, 528], [894, 528]],
};
const edges = {};
for (const k in E) {
  const pts = E[k].filter(p => Array.isArray(p)), g = E[k].find(p => typeof p === "string") || "edges";
  edges[k] = el("polyline", { class: "edge", points: pts.map(p => p.join(",")).join(" "), "marker-end": "url(#arr)" }, $(g));
}
function setEdge(id, state) {
  const e = edges[id]; e.classList.remove("hot", "done"); if (state) e.classList.add(state);
  e.setAttribute("marker-end", state === "hot" ? "url(#arr-hot)" : state === "done" ? "url(#arr-done)" : "url(#arr)");
}
el("line", { class: "link", x1: 400, y1: 199, x2: 400, y2: 262 }, $("edges"));
txt({ class: "cond", x: 662, y: 170 }, S.yes, $("yesG"));
txt({ class: "cond", x: 608, y: 226 }, S.no, $("edges"));

const nodes = {};
for (const k in N) {
  const n = N[k];
  const g = el("g", { class: "node" + (n.c ? " endc" : ""), transform: `translate(${n.x},${n.y})` }, $(n.g || "nodes"));
  if (n.c) {
    el("circle", { r: 9 }, g); el("circle", { class: "dot", r: 5 }, g);
    txt({ class: "small", x: n.x, y: n.y + 26, "text-anchor": "middle" }, LABEL[k], $(n.g || "nodes"));
  } else {
    el("rect", { x: -n.w / 2, y: -NH / 2, width: n.w, height: NH, rx: 8 }, g);
    txt({}, LABEL[k] || S.nodes[k], g);
  }
  nodes[k] = g;
}
function setNode(k, state) { const g = nodes[k]; g.classList.remove("active", "done"); if (state) g.classList.add(state); }

// the person who approves the claim email, above the approve node
{
  const g = $("claimG");
  el("circle", { cx: 540, cy: 474, r: 15, fill: "#E2E8F0", stroke: "#8A99AF" }, g);
  el("circle", { cx: 540, cy: 469, r: 5.4, fill: "#64748B" }, g);
  el("path", { d: "M530,486 a10,8.5 0 0 1 20,0", fill: "#64748B" }, g);
  txt({ class: "small", x: 518, y: 478, "text-anchor": "end" }, S.person, g);
}
const approveCheck = el("g", { class: "check", transform: "translate(556,461)" }, $("claimG"));
el("circle", { r: 8, fill: "#0D9488" }, approveCheck);
el("path", { d: "M-3.8,0 L-0.9,3 L3.8,-3", stroke: "#fff", "stroke-width": 2, fill: "none" }, approveCheck);

// the computed difference, a chip under the compute node
const diffChip = el("g", { class: "chip" }, $("claimG"));
el("rect", { x: 98, y: 556, width: 104, height: 22, rx: 4, fill: "#FEF3C7", stroke: "#D97706" }, diffChip);
el("rect", { x: 98, y: 556, width: 5, height: 22, rx: 2, fill: "#F59E0B" }, diffChip);
txt({ x: 110, y: 567.5 }, S.diff, diffChip);

// ---------- compare table, linked to the compare node ----------
const TB = { x: 224, y: 262, w: 360, h: 136 };
const COLX = [348, 424, 500], CW = 72, CH = 28, ROWY = [310, 342, 374];
const table = el("g", { class: "table" }, $("tables"));
el("rect", { class: "t", x: TB.x, y: TB.y, width: TB.w, height: TB.h, rx: 6 }, table);
S.cols.forEach((c, j) => txt({ class: "th", x: COLX[j] + CW / 2, y: 286 }, c, table));
S.docs.forEach((d, i) => txt({ class: "rh", x: TB.x + 12, y: ROWY[i] }, d, table));
const CHECK = "M-3.6,0.4 L-1.2,2.8 L3.6,-2.8", CROSS = "M-2.8,-2.8 L2.8,2.8 M2.8,-2.8 L-2.8,2.8";
const cells = ROWY.map(y => COLX.map(x => {
  const g = el("g", { class: "cell" }, table);
  el("rect", { x, y: y - CH / 2, width: CW, height: CH, rx: 6 }, g);
  const t = txt({ x: x + CW / 2 - 5, y: y + 1 }, "", g);
  const mx = x + CW - 4, my = y - CH / 2 + 4;
  const ok = el("g", { class: "mark mk-ok", transform: `translate(${mx},${my})` }, g);
  el("circle", { r: 7, fill: "#0D9488" }, ok); el("path", { d: CHECK, fill: "none", stroke: "#fff", "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }, ok);
  const bad = el("g", { class: "mark mk-bad", transform: `translate(${mx},${my})` }, g);
  el("circle", { r: 7, fill: "#E11D48" }, bad); el("path", { d: CROSS, fill: "none", stroke: "#fff", "stroke-width": 2, "stroke-linecap": "round" }, bad);
  return { g, t };
}));
function setCell(i, j, state) { const c = cells[i][j]; c.g.classList.remove("ok", "bad"); if (state) c.g.classList.add(state); }

// ---------- tokens: figures that fly from each document through extract into its row, and the claim email ----------
const flys = [0, 1, 2].map(() => {
  const g = el("g", { class: "tok" }, $("toks"));
  const r = el("rect", { y: -14, height: 28, rx: 14, fill: "#F59E0B" }, g);
  const t = txt({ x: 0, y: 1 }, "", g);
  return { g, r, t };
});
const envelope = el("g", { class: "tok" }, $("toks"));
el("rect", { x: -15, y: -10, width: 30, height: 20, rx: 3, fill: "#F59E0B" }, envelope);
el("path", { d: "M-14,-8 L0,2 L14,-8", stroke: "#fff", "stroke-width": 1.8, fill: "none" }, envelope);

// ---------- the claim email, opened in the supplier panel ----------
const MAIL = { x: 912, y: 460, w: 328, h: 136 };
{
  const g = $("mailG");
  el("rect", { x: MAIL.x, y: MAIL.y, width: MAIL.w, height: MAIL.h, rx: 6, fill: "#FFFFFF", stroke: "#F59E0B", "stroke-width": 1.6, filter: "url(#glow-s)" }, g);
  el("g", { transform: `translate(${MAIL.x + 24},${MAIL.y + 24})` }, g).innerHTML = '<rect x="-11" y="-7.5" width="22" height="15" rx="2" fill="#F59E0B"/><path d="M-10,-6 L0,1.5 L10,-6" stroke="#fff" stroke-width="1.6" fill="none"/>';
  el("line", { x1: MAIL.x + 44, y1: MAIL.y + 24, x2: MAIL.x + MAIL.w - 16, y2: MAIL.y + 24, stroke: "#E2E8F0", "stroke-width": 2 }, g);
  S.mail.forEach((s, i) => txt({ class: "mline" + (i === 1 ? " diff" : ""), x: MAIL.x + 16, y: MAIL.y + 62 + i * 28 }, s, g));
}

// ---------- timeline engine ----------
let runId = 0, paused = false, speed = 1;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
function tween(dur, fn) {
  const my = runId;
  return new Promise((res, rej) => {
    let t = 0, last = null;
    function f(ts) {
      if (my !== runId) return rej("restart");
      if (last === null) last = ts;
      if (!paused) t += (ts - last) * speed;
      last = ts;
      const p = Math.min(1, t / dur);
      fn(p);
      p < 1 ? requestAnimationFrame(f) : res();
    }
    requestAnimationFrame(f);
  });
}
const wait = ms => tween(ms, () => {});
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const bg = p => p.catch(e => { if (e !== "restart") throw e; });
function move(g, pts, dur) {
  const segs = []; let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); total += l; }
  const place = (x, y) => g.setAttribute("transform", `translate(${x},${y})`);
  place(pts[0][0], pts[0][1]); g.classList.add("on");
  return tween(RM ? 1 : dur, p => {
    let d = ease(p) * total, i = 0;
    while (i < segs.length - 1 && d > segs[i]) { d -= segs[i]; i++; }
    const r = segs[i] ? d / segs[i] : 1;
    place(pts[i][0] + (pts[i + 1][0] - pts[i][0]) * r, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * r);
  });
}
// an edge pulses amber while the flow crosses it, then stays teal
async function cross(id) { setEdge(id, "hot"); await wait(T.edge); setEdge(id, "done"); }

// progress follows the story clock; LOOP is the story length of one pass as measured by record.py (lastStoryMs)
const LOOP = 33700;
let vt = 0, lastTs = null, storyStart = null;
function ticker(ts) {
  if (lastTs !== null && !paused) vt += (ts - lastTs) * speed;
  lastTs = ts;
  if (storyStart !== null) $("progress").setAttribute("width", Math.min(1, (vt - storyStart) / LOOP) * 1232);
  requestAnimationFrame(ticker);
}
requestAnimationFrame(ticker);

// ---------- one round ----------
function resetRound(r) {
  for (const k in nodes) setNode(k, null);
  for (const k in edges) setEdge(k, null);
  $("claimG").setAttribute("class", "idle"); $("yesG").setAttribute("class", "lit");
  $("subframe").classList.remove("open");
  diffChip.classList.remove("on"); approveCheck.classList.remove("on"); $("mailG").classList.remove("on");
  cells.forEach(row => row.forEach(c => { c.t.textContent = ""; c.g.classList.remove("ok", "bad"); }));
  flys.forEach(f => f.g.classList.remove("on")); envelope.classList.remove("on");
  table.classList.remove("flash");
  $("tag").textContent = S.round[r];
}
// a step: the incoming edge pulses while the node turns active, and the node stays active for the whole hold
async function step(k, ms, body, inEdge) {
  setNode(k, "active");
  if (inEdge) bg(cross(inEdge));
  await Promise.all([wait(ms), body ? body() : null]);
  setNode(k, "done");
}
async function round(r) {
  const F = S.figs[r], bad = r === 1;
  resetRound(r);
  // the three documents arrive, one after another
  for (let i = 0; i < 3; i++) { setNode("doc" + i, "done"); await wait(T.docs / 3); }
  // extract: each document's figures fly through the extract node into its table row
  await step("extract", T.extract, async () => {
    await Promise.all([0, 1, 2].map(async i => {
      await wait(i * T.flyGap);
      bg(cross("c" + i));
      const f = flys[i];
      f.t.textContent = F[i].join("  ");
      const w = f.t.getComputedTextLength() + 26;
      f.r.setAttribute("x", -w / 2); f.r.setAttribute("width", w);
      await move(f.g, [[N.doc0.x + 40, N["doc" + i].y], [N.extract.x, N.extract.y], [COLX[1] + CW / 2, ROWY[i]]], T.fly);
      f.g.classList.remove("on");
      F[i].forEach((v, j) => { cells[i][j].t.textContent = v; });
    }));
  });
  // compare: column by column; in round 2 the invoice quantity and total fail against the delivery note
  await step("compare", T.compare[r], async () => {
    table.classList.add("flash");
    await wait(300);
    for (const j of bad ? [1, 0, 2] : [0, 1, 2]) {
      for (let i = 0; i < 3; i++) {
        if (bad && j !== 1 && i === 0) continue;
        setCell(i, j, bad && j !== 1 && i === 2 ? "bad" : "ok");
        await wait(140);
      }
      await wait(bad ? 520 : 400);
    }
    table.classList.remove("flash");
  }, "ex-cmp");
  // decision: the yes branch to register, or the no branch into the claim subgraph
  await step("decide", T.decide, async () => {
    await wait(500);
    if (bad) {
      $("yesG").setAttribute("class", "idle"); $("claimG").setAttribute("class", "lit");
      $("subframe").classList.add("open");
    }
  }, "cmp-dec");
  if (!bad) {
    await step("register", T.register, null, "yes");
    await step("end1", T.end, null, "reg-end");
    return;
  }
  await step("compute", T.compute, async () => { await wait(600); diffChip.classList.add("on"); }, "no");
  await step("draft", T.draft, null, "cd-dr");
  await step("approve", T.approve, async () => { await wait(900); approveCheck.classList.add("on"); }, "dr-ap");
  // send: the email flies along the edge to the supplier and opens into a card
  await step("send", T.send, async () => {
    await wait(250);
    setEdge("se-sup", "hot");
    await move(envelope, [[780, 528], [900, 528], [MAIL.x + 24, MAIL.y + 24]], T.mail);
    envelope.classList.remove("on");
    setEdge("se-sup", "done");
    $("mailG").classList.add("on");
  }, "ap-se");
  await step("end2", T.end, null, "se-end");
}

// ---------- story ----------
async function story() {
  storyStart = vt; $("progress").setAttribute("width", 0);
  await round(0);
  await round(1);
  window.lastStoryMs = vt - storyStart;
  $("progress").setAttribute("width", 1232); storyStart = null;
  await wait(T.hold);
}
async function loop() {
  const my = ++runId;
  try { while (my === runId) await story(); } catch (e) { if (e !== "restart") throw e; }
}
$("btn-pause").onclick = () => { paused = !paused; $("btn-pause").textContent = paused ? S.btn.play : S.btn.pause; };
$("btn-restart").onclick = () => { paused = false; $("btn-pause").textContent = S.btn.pause; loop(); };
$("btn-speed").onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; $("btn-speed").textContent = S.btn.speed + " " + speed + "x"; };
$("btn-clean").onclick = () => document.body.classList.toggle("clean");
if (location.hash === "#clean") document.body.classList.add("clean");
loop();
</script>
