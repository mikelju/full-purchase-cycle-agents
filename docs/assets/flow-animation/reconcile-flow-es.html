<meta charset="utf-8">
<title>Flujo de conciliación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap">
<style>
/* Layout: one fixed 16:9 stage (GIF-ready) - invoices | reconcile graph + caption + three-way match | database. Single deliberate light, high-contrast look, independent of the OS theme. */
:root {
  --ground: #EDF1F7;
  --panel: #FFFFFF;
  --panel-edge: #B9C4D4;
  --ink: #0F172A;
  --muted: #475569;
  --line: #8A99AF;
  --node: #FFFFFF;
  --node-edge: #5B6B82;
  --active: #0891B2;
  --title: #4338CA;
  --done: #0D9488;
  --done-soft: #CCFBF1;
  --done-ink: #134E4A;
  --idle: #F4F6FA;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --sans: "Inter", system-ui, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { background: var(--ground); color: var(--ink); }
body { font-family: var(--sans); padding-block: 16px; padding-inline: 16px; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 10px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 600 14px/1.3 var(--mono); letter-spacing: .02em; margin: 0; text-wrap: balance; color: var(--title); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: 500 12px var(--mono); color: var(--ink); background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button:hover { border-color: var(--active); color: var(--title); }
button:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
.stage { overflow-x: auto; }
svg { display: block; width: 100%; min-width: 0; height: auto; background: var(--ground); }
body.clean header { display: none; }

.frame { fill: var(--panel); stroke: var(--panel-edge); stroke-width: 1.2; filter: url(#shadow); }
.flabel { font: 700 12px var(--mono); fill: var(--title); letter-spacing: .16em; text-transform: uppercase; }
.small { font: 400 11px var(--mono); fill: var(--muted); }

.node rect { fill: var(--node); stroke: var(--node-edge); stroke-width: 1.4; transition: fill .3s, stroke .3s; }
.node text { font: 600 13px var(--mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; transition: fill .3s; }
.node circle { fill: var(--node); stroke: var(--muted); stroke-width: 1.6; transition: fill .3s, stroke .3s; }
.node.endc circle.dot { fill: var(--muted); stroke: none; }
.node.active rect { fill: var(--oc, var(--active)); stroke: var(--oc, var(--active)); }
.node.active rect:not(.ring) { filter: url(#glow); }
.node.active text { fill: var(--ot, #0F172A); font-weight: 700; }
.node.active circle { stroke: var(--oc, var(--active)); }
.node.active circle.dot { fill: var(--oc, var(--active)); }
.node rect.ring { fill: none; stroke: var(--oc, var(--active)); stroke-width: 2.4; opacity: 0; transition: opacity .3s; filter: url(#glow-s); }
.node.active rect.ring { opacity: 1; fill: none; }
.node.done rect { fill: var(--done-soft); stroke: var(--done); stroke-width: 1.8; }
.node.done rect.ring { opacity: 0; fill: none; }
.node.done text { fill: var(--done-ink); }
.node.done circle { stroke: var(--done); }
.node.done circle.dot { fill: var(--done); }

.edge { fill: none; stroke: var(--line); stroke-width: 1.6; transition: stroke .3s; }
.edge.hot { stroke: var(--oc, var(--active)); stroke-width: 2.6; stroke-dasharray: 9 5; animation: flow .45s linear infinite; filter: url(#glow-e); }
@keyframes flow { to { stroke-dashoffset: -14; } }
.edge.done { stroke: var(--done); stroke-opacity: .9; stroke-width: 2; }

.table rect.t { fill: #F8FAFC; stroke: var(--panel-edge); transition: stroke .3s; }
.table text.tn { font: 700 11px var(--mono); fill: #1E293B; }
.table.flash rect.t { stroke: var(--active); stroke-width: 2; filter: url(#glow-s); }
.chip { opacity: 0; transition: opacity .4s; }
.chip.on { opacity: 1; }
.chip rect { stroke-width: 1; }
.chip text { font: 500 10.5px var(--mono); dominant-baseline: central; white-space: pre; fill: var(--ink); }
.chip.ok rect:first-child { fill: var(--done-soft); stroke: var(--done); }
.chip.bad rect:first-child { fill: #FFF1F2; stroke: #E11D48; }
.chip.found rect:first-child { stroke: #7C3AED; stroke-width: 2.2; }

/* the token is shown only while it travels; no fade, so it never lingers over a node label */
.tok { opacity: 0; filter: url(#glow-t); }
.tok.on { opacity: 1; }
.progress { fill: url(#prog); }
@media (prefers-reduced-motion: reduce) { .edge.hot { animation: none; } }
.fx { opacity: 0; transition: opacity .4s; }
.fx.on { opacity: 1; }
.box { fill: #fff; stroke: var(--panel-edge); stroke-width: 1.4; }
.cap { font: 600 20px var(--sans); fill: #FFFFFF; dominant-baseline: central; text-anchor: middle; }
</style>

<div class="wrap">
  <header>
    <h1 id="h1"></h1>
    <div class="controls">
      <button id="btn-pause" type="button"></button>

    <defs>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#EDF1F7"/><circle cx="12" cy="12" r="1.1" fill="#D3DAE5"/></pattern>
      <linearGradient id="prog" x1="0" x2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset=".5" stop-color="#0891B2"/><stop offset="1" stop-color="#0D9488"/></linearGradient>
      <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1E293B" flood-opacity=".14"/></filter>
      <filter id="glow" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/><feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/><feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope=".6"/></feComponentTransfer><feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-t" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/><feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope=".4"/></feComponentTransfer><feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-e" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720"><feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A99AF"/></marker>
      <marker id="arr-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
      <marker id="arr-done" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker>
    </defs>

    <rect width="1280" height="720" fill="url(#dots)"/>

    <!-- left: invoices to reconcile -->
    <rect class="frame" x="24" y="56" width="170" height="210" rx="10"/>
    <text class="flabel" x="36" y="80">documents/</text>
    <text class="small" x="36" y="98" id="lbl-inv"></text>
    <g id="files"></g>

    <!-- center: graph, caption strip, three-way match -->
    <rect class="frame" x="220" y="56" width="800" height="112" rx="10"/>
    <text class="flabel" x="232" y="78" id="lbl-graph"></text>
    <g id="graph"></g>
    <g id="capg">
      <rect x="220" y="176" width="800" height="54" rx="10" fill="#1E1B4B"/>
      <path id="cap-ptr" d="M-9,176 L0,167 L9,176 z" fill="#1E1B4B" opacity="0"/>
      <text class="cap" id="cap" x="620" y="203"></text>
    </g>
    <rect class="frame" x="220" y="240" width="800" height="450" rx="10"/>
    <text class="flabel" x="232" y="262" id="lbl-match"></text>
    <g id="match"></g>

    <!-- right: database -->
    <rect class="frame" x="1046" y="56" width="210" height="436" rx="10"/>
    <ellipse cx="1068" cy="76" rx="10" ry="4" fill="none" stroke="#4338CA"/>
    <path d="M1058,76 v12 a10,4 0 0 0 20,0 v-12" fill="none" stroke="#4338CA"/>
    <text class="flabel" x="1086" y="86">purchase_cycle.db</text>
    <g id="tables"></g>

    <g id="ptoks"></g>

    <rect x="24" y="704" width="1232" height="4" rx="2" fill="#D5DCE6"/>
    <rect class="progress" id="progress" x="24" y="704" width="0" height="4" rx="2"/>
  </svg>
  </div>
</div>

<script>
// ---------- every visible string (the Spanish page differs only in this block, the charset and the <title>) ----------
const S = {
  h1: "grafo de conciliación (leer, extraer, enlazar, cotejar, guardar) - factura de proveedor vs orden de compra vs albarán",
  aria: "Flujo animado de dos facturas de proveedor por el grafo de conciliación: una coincide con su orden de compra y su albarán, la otra tiene una diferencia de cantidad y pasa al grafo de reclamación",
  btn: { pause: "Pausa", play: "Reanudar", restart: "Reiniciar", speed: "Velocidad", clean: "Fotograma limpio" },
  invoices: "facturas por conciliar", invoice: "factura",
  graph: "grafo de conciliación", match: "cotejo a tres bandas",
  nodes: { read: "leer", extract: "extraer", link: "enlazar", match: "cotejar", store: "guardar" },
  subs: { read: "txt pdf xlsx", extract: "Claude Haiku 4.5", link: "PO-NNNN", match: "código determinista", store: "SQLite" },
  heads: ["orden de compra", "albarán", "factura"],
  introTitle: "Conciliar una factura: pedido, albarán y factura",
  introCap: "el albarán llegó antes y ya está guardado",
  dnChip: "alb  ", invChip: "fac  ",
  res: { matched: { label: "CONCILIADA", db: "conciliada" }, discrepancies: { label: "CON DISCREPANCIAS", db: "discrepancias" } },
  qty: "cantidad",
  cases: [
    { title: "Caso 1 - todo cuadra",
      ext: "factura  F-2026-1001  PO-0001  GLV-NIT-M  100 x 4.20",
      caps: { read: "huella del archivo (SHA-256): nunca se procesa dos veces",
              extract: "Claude Haiku lee la factura: GLV-NIT-M, 100 x 4.20 EUR",
              link: "la factura cita PO-0001: pedido encontrado",
              match: "pedido 100 x 4.20 / albarán 100 / factura 100 x 4.20: todo coincide",
              store: "conciliación guardada, sin discrepancias" } },
    { title: "Caso 2 - no cuadra",
      ext: "factura  LV-0303  PO-0003  GAUZE-NS-5  35 x 5.00",
      diff: "GAUZE-NS-5  pedido 40, facturado 35  -25.00 EUR",
      caps: { read: "huella nueva",
              extract: "lee: GAUZE-NS-5, 35 x 5.00 EUR",
              link: "cita PO-0003: pedido encontrado",
              match: "pedido 40 / albarán 40 / factura 35: diferencia de cantidad, -25.00 EUR",
              store: "conciliación con discrepancias y una fila de discrepancia" } },
  ],
  nextTitle: "Qué pasa después",

<script>
const SVGNS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const el = (tag, attrs, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (attrs, s, parent) => { const e = el("text", attrs, parent); e.textContent = s; return e; };

const TEAL = "#0D9488", ROSE = "#E11D48", PURPLE = "#7C3AED";

$("h1").textContent = S.h1; $("svg").setAttribute("aria-label", S.aria);
$("btn-pause").textContent = S.btn.pause; $("btn-restart").textContent = S.btn.restart;
$("btn-speed").textContent = S.btn.speed + " 1x"; $("btn-clean").textContent = S.btn.clean;
$("lbl-inv").textContent = S.invoices; $("lbl-graph").textContent = S.graph; $("lbl-match").textContent = S.match;

// ---------- timeline (ms): holds per node follow the approved script of change 017 ----------
const T = {
  intro: 2000,
  caseTitle: [600, 400], entry: [800, 500], hop: 150,
  holds: [{ read: 1400, extract: 2200, link: 1400, match: 2600, store: 1400 },
          { read: 900, extract: 1600, link: 900, match: 3600, store: 1400 }],
  stamp: [1800, 2200],
  next: 3000,
};

// ---------- sample data (examples/invoices) ----------
const CASES = [
  { file: "inv-001-nitrile.txt", t: "TXT", po: "PO-0001", dn: "A-5001", inv: "F-2026-1001", sku: "GLV-NIT-M",
    o: "100 x 4.20", d: "100", i: "100 x 4.20", bad: false, result: "matched" },
  { file: "inv-003-gauze.xlsx", t: "XLSX", po: "PO-0003", dn: "E-0303", inv: "LV-0303", sku: "GAUZE-NS-5",
    o: "40 x 5.00", d: "40", i: "35 x 5.00", bad: true, result: "discrepancies" },
];

// ---------- left: invoice cards ----------
const SLOT = [144, 214];
const BADGE = { TXT: "#475569", XLSX: "#15803D" };
const fileEls = CASES.map((f, i) => {
  const cy = SLOT[i], g = el("g", {}, $("files"));
  const r = el("rect", { x: 34, y: cy - 28, width: 150, height: 56, rx: 8, fill: "#fff", stroke: "#B9C4D4", "stroke-width": 1.4 }, g);
  const w = f.t.length * 7 + 12;
  el("rect", { x: 42, y: cy - 22, width: w, height: 14, rx: 7, fill: BADGE[f.t] }, g);
  txt({ x: 42 + w / 2, y: cy - 15, style: "font:700 9px var(--mono);fill:#fff;dominant-baseline:central;text-anchor:middle" }, f.t, g);
  txt({ x: 42, y: cy + 6, style: "font:600 10px var(--mono);fill:var(--ink)" }, f.file, g);
  txt({ x: 42, y: cy + 21, style: "font:400 10.5px var(--sans);fill:var(--muted)" }, S.invoice + " " + f.inv, g);
  return r;
});
function markFile(i, on) { fileEls[i].setAttribute("stroke", on ? PURPLE : "#B9C4D4"); fileEls[i].setAttribute("stroke-width", on ? 2.4 : 1.4); }

// ---------- graph ----------
const NH = 38, NW = 86, GY = 112;
const N = {
  r_start: { x: 252, c: 1 }, read: { x: 350 }, extract: { x: 490 }, link: { x: 630 },
  match: { x: 770 }, store: { x: 910 }, r_end: { x: 992, c: 2 },
};
const ORDER = Object.keys(N);
const rad = n => n.c ? 9 : NW / 2;
const edgeEls = {}, nodeEls = {};
function drawGraph(parent, nodes, order, y, w, labels, color) {
  const edges = {}, els = {};
  for (let i = 1; i < order.length; i++) {
    const A = nodes[order[i - 1]], B = nodes[order[i]], ra = A.c ? 9 : w / 2, rb = B.c ? 9 : w / 2;
    edges[order[i - 1] + ">" + order[i]] = el("polyline", { class: "edge", points: `${A.x + ra},${y} ${B.x - rb - 1},${y}`, "marker-end": "url(#arr)" }, parent);
  }
  for (const k of order) {
    const n = nodes[k];
    const g = el("g", { class: "node" + (n.c === 2 ? " endc" : ""), transform: `translate(${n.x},${y})` }, parent);
    g.style.setProperty("--oc", color); g.style.setProperty("--ot", "#FFFFFF");
    if (n.c) { el("circle", { r: 9 }, g); if (n.c === 2) el("circle", { class: "dot", r: 5 }, g); }
    else {
      el("rect", { class: "ring", x: -w / 2 - 4, y: -NH / 2 - 4, width: w + 8, height: NH + 8, rx: 11 }, g);
      el("rect", { x: -w / 2, y: -NH / 2, width: w, height: NH, rx: 8 }, g);
      txt({}, labels[k], g);
    }
    els[k] = g;
  }
  return { edges, els };
}
const GR = $("graph");
{ const d = drawGraph(GR, N, ORDER, GY, NW, S.nodes, PURPLE); Object.assign(edgeEls, d.edges); Object.assign(nodeEls, d.els); }
for (const k in S.subs) txt({ class: "small", x: N[k].x, y: 154, "text-anchor": "middle" }, S.subs[k], GR);

function setNode(els, k, state) { const g = els[k]; g.classList.remove("active", "done"); if (state) g.classList.add(state); }
function setEdge(edges, a, b, state) {
  const e = edges[a + ">" + b];
  e.classList.remove("hot", "done"); if (state) e.classList.add(state);
  e.setAttribute("marker-end", state === "hot" ? "url(#arr-hot)" : state === "done" ? "url(#arr-done)" : "url(#arr)");
}
const node = (k, s) => setNode(nodeEls, k, s), edge = (a, b, s) => setEdge(edgeEls, a, b, s);
function resetGraph() { for (const k of ORDER) node(k, null); for (let i = 1; i < ORDER.length; i++) edge(ORDER[i - 1], ORDER[i], null); }

// ---------- caption strip under the graph: one line per active node ----------
function caption(s, x) {
  const c = $("cap");
  c.textContent = s || ""; c.style.fontSize = "";
  if (s) { const w = c.getComputedTextLength(); if (w > 764) c.style.fontSize = (20 * 764 / w).toFixed(1) + "px"; }
  const p = $("cap-ptr");
  if (x) { p.setAttribute("transform", `translate(${x},0)`); p.setAttribute("opacity", 1); } else p.setAttribute("opacity", 0);
}

// ---------- database ----------
const TB = { purchase_orders: { y: 100, h: 78 }, supplier_documents: { y: 190, h: 126 }, reconciliations: { y: 328, h: 78 }, discrepancies: { y: 418, h: 56 } };
const tableEls = {};
for (const k in TB) {
  const t = TB[k], g = el("g", { class: "table" }, $("tables"));
  el("rect", { class: "t", x: 1054, y: t.y, width: 194, height: t.h, rx: 6 }, g);
  txt({ class: "tn", x: 1062, y: t.y + 16 }, k, g);
  tableEls[k] = g;
}
function chip(t, y, text, cls, color) {
  const g = el("g", { class: "chip " + cls }, tableEls[t]);
  el("rect", { x: 1062, y: y - 10, width: 178, height: 20, rx: 4 }, g);
  el("rect", { x: 1062, y: y - 10, width: 5, height: 20, rx: 2, fill: color, style: "stroke:none" }, g);
  txt({ x: 1073, y }, text, g);
  return g;
}
const chips = CASES.map((c, i) => ({
  po: chip("purchase_orders", 136 + i * 24, c.po + "  " + c.sku, "ok", TEAL),
  dn: chip("supplier_documents", 226 + i * 24, S.dnChip + c.dn, "ok", TEAL),
  inv: chip("supplier_documents", 274 + i * 24, S.invChip + c.inv, "ok", PURPLE),
  rec: chip("reconciliations", 364 + i * 24, c.inv.padEnd(12) + S.res[c.result].db, c.bad ? "bad" : "ok", c.bad ? ROSE : TEAL),
}));
const discChip = chip("discrepancies", 454, S.qty.padEnd(10) + "-25.00 EUR", "bad", ROSE);
function flash(t) { tableEls[t].classList.add("flash"); setTimeout(() => tableEls[t].classList.remove("flash"), 700); }
const fxOn = e => e.classList.add("on"), fxOff = e => e.classList.remove("on");
const found = (c, on) => c.classList.toggle("found", on);

// ---------- center: case title, extraction, ledger, stamp ----------
const MG = $("match");
const titleG = el("g", { class: "fx" }, MG);
const titleBar = el("rect", { x: 240, y: 280, width: 8, height: 44, rx: 4, fill: PURPLE }, titleG);
const titleTx = txt({ x: 262, y: 303, style: "font:700 28px var(--sans);fill:var(--ink);dominant-baseline:central" }, "", titleG);

const ext = el("g", { class: "fx" }, MG);
el("rect", { class: "box", x: 240, y: 344, width: 760, height: 52, rx: 10 }, ext);
const extTx = txt({ x: 258, y: 371, class: "fx", style: "font:600 16px var(--mono);fill:var(--ink);dominant-baseline:central" }, "", ext);
const pill = el("g", { class: "fx" }, MG);
el("rect", { x: 886, y: 358, width: 100, height: 26, rx: 13, fill: "#EEF2FF", stroke: "#4338CA", "stroke-width": 1.6 }, pill);
txt({ x: 936, y: 371, style: "font:700 12px var(--mono);fill:#4338CA;dominant-baseline:central;text-anchor:middle" }, "Haiku 4.5", pill);

const CX = [384, 590, 796], CWID = 196, RY = 438, CH = 48;
const ledG = el("g", { class: "fx" }, MG);
const heads = S.heads.map((h, i) => txt({ x: CX[i] + CWID / 2, y: 424, style: "font:700 12.5px var(--mono);fill:var(--muted);text-anchor:middle" }, h, ledG));
const skuTx = txt({ x: 240, y: RY + CH / 2 + 1, style: "font:700 14px var(--mono);fill:var(--ink);dominant-baseline:central" }, "", ledG);
const cells = CX.map(x => {
  const g = el("g", { class: "fx" }, MG);
  const rect = el("rect", { x, y: RY, width: CWID, height: CH, rx: 8 }, g);
  const text = txt({ x: x + CWID / 2, y: RY + CH / 2 + 1, style: "font:600 18px var(--mono);dominant-baseline:central;text-anchor:middle" }, "", g);
  return { g, rect, text };
});
const CELLSTYLE = { norm: ["#fff", "#B9C4D4", 1.4, "#0F172A", ""], ok: ["#F0FDFA", TEAL, 2.4, "#134E4A", ""], bad: ["#FFF1F2", ROSE, 2.8, "#9F1239", "5 3"] };
function setCell(i, text, state) {
  const cell = cells[i], s = CELLSTYLE[state];
  if (text !== null) cell.text.textContent = text;
  cell.rect.setAttribute("fill", s[0]); cell.rect.setAttribute("stroke", s[1]); cell.rect.setAttribute("stroke-width", s[2]);
  if (s[4]) cell.rect.setAttribute("stroke-dasharray", s[4]); else cell.rect.removeAttribute("stroke-dasharray");
  cell.text.style.fill = s[3];
  fxOn(cell.g);
}

const stampG = el("g", { class: "fx" }, MG);
const stampRect = el("rect", { y: 526, height: 64, rx: 10, "stroke-width": 4 }, stampG);
const stampTx = txt({ y: 559, style: "font:700 34px var(--mono);dominant-baseline:central;text-anchor:middle;letter-spacing:.06em" }, "", stampG);
const diffG = el("g", { class: "fx" }, MG);
const diffW = S.qty.length * 9.5 + 28;
el("rect", { x: 240, y: 620, width: diffW, height: 36, rx: 18, fill: ROSE }, diffG);
txt({ x: 240 + diffW / 2, y: 638, style: "font:700 15px var(--mono);fill:#fff;dominant-baseline:central;text-anchor:middle" }, S.qty, diffG);
const diffTx = txt({ x: 240 + diffW + 16, y: 638, style: "font:600 17px var(--mono);fill:var(--ink);dominant-baseline:central" }, "", diffG);
function stamp(c) {
  const color = c.bad ? ROSE : TEAL, label = S.res[c.result].label, w = label.length * 22 + 56, x0 = 620 - w / 2;
  stampRect.setAttribute("x", x0); stampRect.setAttribute("width", w);
  stampRect.setAttribute("fill", c.bad ? "#FFF1F2" : "#F0FDFA"); stampRect.setAttribute("stroke", color);
  stampTx.setAttribute("x", 620); stampTx.style.fill = color; stampTx.textContent = label;
  stampG.setAttribute("transform", "rotate(-3 620 558)");
  fxOn(stampG);
}

// ---------- closing scene: the claim graph in small ----------
const nextG = el("g", { class: "fx" }, MG);
txt({ x: 262, y: 400, class: "flabel", style: "letter-spacing:.1em;text-transform:none;font-size:13px" }, S.claimGraph, nextG);
const CN = { c_start: { x: 300, c: 1 }, draft: { x: 440 }, review: { x: 620 }, send: { x: 800 }, c_end: { x: 920, c: 2 } };
const CORDER = Object.keys(CN);
const claim = drawGraph(nextG, CN, CORDER, 470, 120, S.claim, TEAL);
const personG = el("g", { transform: "translate(620,522)" }, nextG);
el("circle", { cx: 0, cy: 0, r: 7, fill: "none", stroke: "#4338CA", "stroke-width": 2 }, personG);
el("path", { d: "M-12,22 a12,12 0 0 1 24,0", fill: "none", stroke: "#4338CA", "stroke-width": 2 }, personG);
txt({ x: 0, y: 44, style: "font:600 15px var(--sans);fill:#4338CA;text-anchor:middle" }, S.person, personG);

// ---------- token ----------
el("g", { class: "tok", id: "tinv" }, $("ptoks")).innerHTML = `<rect x="-9" y="-12" width="18" height="24" rx="3" fill="${PURPLE}"/><rect x="-5" y="-7" width="10" height="2.5" rx="1" fill="#fff"/><rect x="-5" y="-2" width="10" height="2.5" rx="1" fill="#fff"/><rect x="-5" y="3" width="7" height="2.5" rx="1" fill="#fff"/>`;

// ---------- timeline engine ----------
let runId = 0, paused = false, speed = 1;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
function tween(dur, fn) {
  const my = runId;
  return new Promise((res, rej) => {
    let t = 0, last = null;
    function f(ts) {
      if (my !== runId) return rej("restart");
      if (last === null) last = ts;
      if (!paused) t += (ts - last) * speed;
      last = ts;
      const p = Math.min(1, t / dur);
      fn(p);
      p < 1 ? requestAnimationFrame(f) : res();
    }
    requestAnimationFrame(f);
  });
}
const wait = ms => tween(ms, () => {});
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
function place(id, x, y) { $(id).setAttribute("transform", `translate(${x},${y})`); }
function move(id, pts, dur) {
  const segs = []; let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); total += l; }
  place(id, pts[0][0], pts[0][1]); $(id).classList.add("on");
  return tween(RM ? 1 : dur, p => {
    let d = ease(p) * total, i = 0;
    while (i < segs.length - 1 && d > segs[i]) { d -= segs[i]; i++; }
    const r = segs[i] ? d / segs[i] : 1;
    place(id, pts[i][0] + (pts[i + 1][0] - pts[i][0]) * r, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * r);
  });
}
const hideTok = () => $("tinv").classList.remove("on");

// progress follows the story clock; LOOP is the measured story length of one pass
const LOOP = 31250;
let vt = 0, lastTs = null, storyStart = null;
function ticker(ts) {
  if (lastTs !== null && !paused) vt += (ts - lastTs) * speed;
  lastTs = ts;
  if (storyStart !== null) $("progress").setAttribute("width", Math.min(1, (vt - storyStart) / LOOP) * 1232);
  requestAnimationFrame(ticker);
}
requestAnimationFrame(ticker);

// ---------- one invoice through the graph ----------
function hooks(c, k) {
  const ch = chips[k];
  return {
    extract: async ms => {
      fxOn(ext); fxOn(pill); await wait(ms * .45); fxOff(pill);
      extTx.textContent = S.cases[k].ext; fxOn(extTx);
      setCell(2, c.i, "norm");
    },
    link: async () => {
      found(ch.po, true); found(ch.dn, true); flash("purchase_orders"); flash("supplier_documents");
      heads[0].textContent = S.heads[0] + " " + c.po; heads[1].textContent = S.heads[1] + " " + c.dn;
      setCell(0, c.o, "norm"); setCell(1, c.d, "norm");
    },
    match: async ms => {
      found(ch.po, false); found(ch.dn, false);
      await wait(ms * .25); setCell(0, null, "ok");
      await wait(ms * .12); setCell(1, null, "ok");
      await wait(ms * .12); setCell(2, null, c.bad ? "bad" : "ok");
      if (c.bad) { await wait(ms * .1); diffTx.textContent = S.cases[k].diff; fxOn(diffG); }
    },
    store: async () => {
      flash("supplier_documents"); fxOn(ch.inv);
      setTimeout(() => { flash("reconciliations"); fxOn(ch.rec); }, 300);
      if (c.bad) setTimeout(() => { flash("discrepancies"); fxOn(discChip); }, 600);
    },
  };
}
async function runCase(c, k) {
  resetGraph(); caption("");
  [ext, extTx, pill, stampG, diffG].forEach(fxOff); cells.forEach(x => fxOff(x.g));
  heads[0].textContent = S.heads[0]; heads[1].textContent = S.heads[1];
  skuTx.textContent = c.sku; fxOn(ledG);
  titleTx.textContent = S.cases[k].title; titleBar.setAttribute("fill", c.bad ? ROSE : TEAL); fxOn(titleG);
  markFile(k, true);
  await wait(T.caseTitle[k]);
  const H = hooks(c, k), cy = SLOT[k];
  await move("tinv", [[184, cy], [207, cy], [207, GY], [N.r_start.x, GY]], T.entry[k]);
  node("r_start", "done");
  for (let i = 1; i < ORDER.length; i++) {
    const a = ORDER[i - 1], b = ORDER[i];
    edge(a, b, "hot");
    await move("tinv", [[N[a].x + rad(N[a]) + 10, GY], [N[b].x - rad(N[b]) - 10, GY]], T.hop);
    hideTok();
    edge(a, b, "done");
    if (b === "r_end") { node(b, "done"); break; }
    node(b, "active");
    caption(S.cases[k].caps[b], N[b].x);
    const h = T.holds[k][b];
    (H[b] ? H[b](h) : Promise.resolve()).catch(e => { if (e !== "restart") throw e; });
    await wait(h);
    node(b, "done");
  }
  markFile(k, false);
  caption(S.cases[k].caps.store);
  stamp(c);
  await wait(T.stamp[k]);
}
async function whatNext() {
  resetGraph(); hideTok();
  [ext, extTx, pill, stampG, diffG, ledG].forEach(fxOff); cells.forEach(x => fxOff(x.g));
  for (const k of CORDER) setNode(claim.els, k, null);
  for (let i = 1; i < CORDER.length; i++) setEdge(claim.edges, CORDER[i - 1], CORDER[i], null);
  titleTx.textContent = S.nextTitle; titleBar.setAttribute("fill", PURPLE);
  caption(S.nextCap); fxOn(nextG); $("lbl-match").textContent = "";
  await wait(400);
  setNode(claim.els, "c_start", "done");
  const step = { draft: 700, review: 1000, send: 700 };
  for (let i = 1; i < CORDER.length; i++) {
    const a = CORDER[i - 1], b = CORDER[i];
    setEdge(claim.edges, a, b, "done");
    if (b === "c_end") { setNode(claim.els, b, "done"); break; }
    setNode(claim.els, b, "active");
    await wait(step[b]);
    setNode(claim.els, b, "done");
  }
  await wait(T.next - 400 - 2400);
}

// ---------- story ----------
function reset() {
  resetGraph(); hideTok(); caption(S.introCap); $("lbl-match").textContent = S.match;
  [ext, extTx, pill, stampG, diffG, ledG, nextG].forEach(fxOff); cells.forEach(x => fxOff(x.g));
  chips.forEach(ch => { fxOn(ch.po); fxOn(ch.dn); fxOff(ch.inv); fxOff(ch.rec); found(ch.po, false); found(ch.dn, false); });
  fxOff(discChip);
  titleTx.textContent = S.introTitle; titleBar.setAttribute("fill", PURPLE); fxOn(titleG);
  storyStart = vt; $("progress").setAttribute("width", 0);
}
async function story() {
  reset();
  await wait(T.intro);
  for (let k = 0; k < CASES.length; k++) await runCase(CASES[k], k);
  await whatNext();
  window.lastStoryMs = vt - storyStart;
  $("progress").setAttribute("width", 1232); storyStart = null;
  await wait(3500);
}
async function loop() {
  const my = ++runId;
  try { while (my === runId) await story(); } catch (e) { if (e !== "restart") throw e; }
}
$("btn-pause").onclick = () => { paused = !paused; $("btn-pause").textContent = paused ? S.btn.play : S.btn.pause; };
$("btn-restart").onclick = () => { paused = false; $("btn-pause").textContent = S.btn.pause; loop(); };
$("btn-speed").onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; $("btn-speed").textContent = S.btn.speed + " " + speed + "x"; };
$("btn-clean").onclick = () => document.body.classList.toggle("clean");
if (location.hash === "#clean") document.body.classList.add("clean");
loop();
</script>
