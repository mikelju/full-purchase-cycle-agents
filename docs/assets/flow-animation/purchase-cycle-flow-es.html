<style>
/* Layout: one fixed 16:9 stage (GIF-ready) - two customers | orders graph + quotes graph | database. Single deliberate light, high-contrast look, independent of the OS theme. */
:root {
  --ground: #EDF1F7;
  --panel: #FFFFFF;
  --panel-edge: #B9C4D4;
  --ink: #0F172A;
  --muted: #475569;
  --line: #8A99AF;
  --node: #FFFFFF;
  --node-edge: #5B6B82;
  --active: #0891B2;
  --title: #4338CA;
  --done: #0D9488;
  --done-soft: #CCFBF1;
  --done-ink: #134E4A;
  --msg: #D97706;
  --msg-soft: #FEF3C7;
  --msg-ink: #92400E;
  --ask: #2563EB;
  --idle: #F4F6FA;
  --wa: #25D366;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --sans: "Inter", system-ui, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { background: var(--ground); color: var(--ink); }
body { font-family: var(--sans); padding-block: 16px; padding-inline: 16px; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 10px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 600 14px/1.3 var(--mono); letter-spacing: .02em; margin: 0; text-wrap: balance; color: var(--title); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: 500 12px var(--mono); color: var(--ink); background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button:hover { border-color: var(--active); color: var(--title); }
button:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
.stage { overflow-x: auto; }
svg { display: block; width: 100%; min-width: 0; height: auto; background: var(--ground); }
body.clean header { display: none; }

.frame { fill: var(--panel); stroke: var(--panel-edge); stroke-width: 1.2; filter: url(#shadow); }
.subframe { fill: var(--idle); stroke: var(--node-edge); stroke-dasharray: 4 4; transition: fill .4s, stroke .4s; }
.subframe.open { fill: #ECFEFF; stroke: var(--active); stroke-width: 1.6; }
.flabel { font: 700 12px var(--mono); fill: var(--title); letter-spacing: .16em; text-transform: uppercase; }
.small { font: 400 11px var(--mono); fill: var(--muted); }
.cond { font: 700 11.5px var(--mono); fill: var(--ink); }

.node rect { fill: var(--node); stroke: var(--node-edge); stroke-width: 1.4; transition: fill .3s, stroke .3s; }
.node text { font: 600 13px var(--mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; transition: fill .3s; }
.node.sub rect { stroke-width: 1.4; }
.node.sub .inner { fill: none; stroke: var(--node-edge); }
.node circle { fill: var(--node); stroke: var(--muted); stroke-width: 1.6; transition: fill .3s, stroke .3s; }
.node.endc circle.dot { fill: var(--muted); stroke: none; }
.node.active rect { fill: var(--oc, var(--active)); stroke: var(--oc, var(--active)); }
.node.active rect:not(.ring):not(.inner) { filter: url(#glow); }
.node.active .inner { stroke: var(--ot, #0F172A); stroke-opacity: .6; fill: none; }
.node.active text { fill: var(--ot, #0F172A); font-weight: 700; }
.node.active circle { stroke: var(--oc, var(--active)); }
.node.active circle.dot { fill: var(--oc, var(--active)); }
.node rect.ring, .node.active rect.ring, .node.done rect.ring, .node.paused rect.ring { fill: none; stroke: var(--rc, var(--active)); stroke-width: 2.4; stroke-dasharray: none; animation: none; opacity: 0; transition: opacity .3s; filter: url(#glow-s); }
.node.dual rect.ring { opacity: 1; }
.node.done rect { fill: var(--done-soft); stroke: var(--done); stroke-width: 1.8; }
.node.done .inner { fill: none; stroke: var(--done); stroke-opacity: .5; }
.node.done text { fill: var(--done-ink); }
.node.done circle { stroke: var(--done); }
.node.done circle.dot { fill: var(--done); }
.node.paused rect { fill: var(--msg-soft); stroke: var(--msg); stroke-width: 2; stroke-dasharray: 5 3; animation: dash 1s linear infinite; }
.node.paused .inner { fill: none; }
.node.paused text { fill: var(--msg-ink); font-weight: 700; }
@keyframes dash { to { stroke-dashoffset: -16; } }
.idlegroup { opacity: .45; }

.edge { fill: none; stroke: var(--line); stroke-width: 1.6; transition: stroke .3s; }
.edge.hot { stroke: var(--oc, var(--active)); stroke-width: 2.6; stroke-dasharray: 9 5; animation: flow .45s linear infinite; filter: url(#glow-e); }
@keyframes flow { to { stroke-dashoffset: -14; } }
.edge.done { stroke: var(--done); stroke-opacity: .9; stroke-width: 2; }
.link { stroke: var(--node-edge); stroke-dasharray: 3 4; fill: none; }

.table rect.t { fill: #F8FAFC; stroke: var(--panel-edge); transition: stroke .3s; }
.table text.tn { font: 700 11px var(--mono); fill: #1E293B; }
.table.flash rect.t { stroke: var(--active); stroke-width: 2; filter: url(#glow-s); }
.chip { opacity: 0; transition: opacity .4s; }
.chip.on { opacity: 1; }
.chip rect { stroke-width: 1; }
.chip text { font: 500 10.5px var(--mono); dominant-baseline: central; white-space: pre; }
.chip.pending rect:first-child { fill: var(--msg-soft); stroke: var(--msg); }
.chip.ok rect:first-child { fill: var(--done-soft); stroke: var(--done); }
.chip.zero rect:first-child { fill: var(--idle); stroke: var(--line); }
.chip text { fill: var(--ink); }

.tok { opacity: 0; transition: opacity .25s; filter: url(#glow-t); }
.tok.on { opacity: 1; }
.typing circle { fill: var(--title); opacity: 0; }
.typing.on circle { animation: blink 1s infinite; }
.typing.on circle:nth-child(2) { animation-delay: .2s; }
.typing.on circle:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
.clock { opacity: 0; transition: opacity .3s; filter: url(#glow-s); }
.clock.on { opacity: 1; }
.clock.on .hand { animation: spin 1.2s linear infinite; transform-origin: 0 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.check { opacity: 0; transition: opacity .3s; filter: url(#glow-s); }
.check.on { opacity: 1; }
.progress { fill: url(#prog); }
@media (prefers-reduced-motion: reduce) {
  .node.paused rect, .clock.on .hand, .typing.on circle, .edge.hot { animation: none; }
}
</style>

<script>
const SVGNS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const el = (tag, attrs, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

// order colors: email amber, whatsapp green, web form purple (vivid tones for the light stage); OT = text on an active fill
const C = {email: "#F59E0B", wa: "#22C55E", wf: "#7C3AED"};
const OT = {email: "#1C1300", wa: "#052E16", wf: "#FFFFFF"};

// ---------- left column: three customers and the supplier ----------
const BADGE = {
  email: '<rect x="-9" y="-6" width="18" height="12" rx="2" fill="#F59E0B"/><path d="M-8,-5 L0,1 L8,-5" stroke="#fff" stroke-width="1.4" fill="none"/>',
  wa: '<path d="M-7,8 L-5.2,2.6 A8,8 0 1 1 -2.4,5.6 Z" fill="#22C55E"/><circle r="8" fill="#22C55E"/><path d="M-3.2,-3.6 l1.6,-0.6 l1.2,2.2 l-1,1 q0.8,1.8 2.6,2.6 l1,-1 l2.2,1.2 l-0.6,1.6 q-4.6,0.4 -7,-7 z" fill="#fff"/>',
  wf: '<rect x="-10" y="-8" width="20" height="16" rx="2" fill="#7C3AED"/><circle cx="-6.5" cy="-4.5" r="1" fill="#fff"/><circle cx="-3.5" cy="-4.5" r="1" fill="#fff"/><rect x="-7" y="-1" width="14" height="2.6" rx="1" fill="#fff"/><rect x="-7" y="3" width="8" height="2.6" rx="1" fill="#fff"/>',
};
function panel(y0, h, label, lines, code, kind, typingId, checkId) {
  const g = el("g", {}, $("panels"));
  el("rect", {class: "frame", x: 24, y: y0, width: 170, height: h, rx: 10}, g);
  el("text", {class: "flabel", x: 36, y: y0 + 24}, g).textContent = label;
  if (kind === "supplier") {
    el("circle", {cx: 109, cy: y0 + 52, r: 22, fill: "#E2E8F0", stroke: "#8A99AF"}, g);
    el("path", {d: `M95,${y0 + 66} V${y0 + 48} L109,${y0 + 38} L123,${y0 + 48} V${y0 + 66} Z`, fill: "#64748B"}, g);
    el("rect", {x: 104, y: y0 + 55, width: 10, height: 11, fill: "#E2E8F0"}, g);
  } else {
    el("circle", {cx: 109, cy: y0 + 52, r: 22, fill: "#E2E8F0", stroke: "#8A99AF"}, g);
    el("circle", {cx: 109, cy: y0 + 45, r: 8, fill: "#64748B"}, g);
    el("path", {d: `M94,${y0 + 69} a15,12 0 0 1 30,0`, fill: "#64748B"}, g);
    el("g", {transform: `translate(87,${y0 + 70})`}, g).innerHTML = BADGE[kind];
  }
  let y = y0 + 92;
  for (const t of lines) { el("text", {x: 109, y, "text-anchor": "middle", style: "font:600 12px var(--sans);fill:var(--ink)"}, g).textContent = t; y += 14; }
  el("text", {class: "small", x: 109, y: y + 1, "text-anchor": "middle"}, g).textContent = code;
  if (typingId) { const t = el("g", {class: "typing", id: typingId, transform: `translate(109,${y0 + 136})`}, g); [-12, 0, 12].forEach(cx => el("circle", {cx, r: 3.5}, t)); }
  if (checkId) el("g", {class: "check", id: checkId, transform: `translate(131,${y0 + 34})`}, g).innerHTML = '<circle r="10" fill="#0D9488"/><path d="M-5,0 L-1,4 L5,-4" stroke="#fff" stroke-width="2.2" fill="none"/>';
}
panel(60, 150, "cliente", ["Residencia Monte Alto"], "RES-010", "email", "typing", "cust-check");
panel(220, 150, "cliente", ["Clinica Fisioterapia", "Deusto"], "CLI-003", "wa", "typing2", "cust-check2");
panel(380, 150, "cliente", ["Clinica Dental Arenal"], "CLI-001", "wf", "typing3", "cust-check3");
panel(546, 144, "proveedor", ["Suministros Medicos", "Iberia S.L."], "SUP-001", "supplier", "typing4", null);
const CUST = {email: [109, 196], wa: [109, 356], wf: [109, 516]}, SUPP = [109, 598];

// ---------- graphs ----------
const NW = 100, NH = 38, ROW = 150;
const N = {
  start: {x: 238, y: ROW, c: 1},
  intake_e: {x: 340, y: 108, label: "canal email", w: 128}, intake_w: {x: 340, y: ROW, label: "canal whatsapp", w: 128},

// ---------- timeline engine ----------
let runId = 0, paused = false, speed = 1;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
function tween(dur, fn) {
  const my = runId;
  return new Promise((res, rej) => {
    let t = 0, last = null;
    function f(ts) {
      if (my !== runId) return rej("restart");
      if (last === null) last = ts;
      if (!paused) t += (ts - last) * speed;
      last = ts;
      const p = Math.min(1, t / dur);
      fn(p);
      p < 1 ? requestAnimationFrame(f) : res();
    }
    requestAnimationFrame(f);
  });
}
const wait = ms => tween(ms, () => {});
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
function place(id, x, y) { $(id).setAttribute("transform", `translate(${x},${y})`); }
function show(id, x, y) { if (x !== undefined) place(id, x, y); $(id).classList.add("on"); }
function hide(id) { $(id).classList.remove("on"); }
function move(id, pts, dur) {
  const segs = []; let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); total += l; }
  show(id, pts[0][0], pts[0][1]);
  return tween(RM ? 1 : dur, p => {
    let d = ease(p) * total, i = 0;
    while (i < segs.length - 1 && d > segs[i]) { d -= segs[i]; i++; }
    const r = segs[i] ? d / segs[i] : 1;
    place(id, pts[i][0] + (pts[i + 1][0] - pts[i][0]) * r, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * r);
  });
}
// per-order state: the last order to arrive fills a node, another live order shows as a ring
const LIVE = s => s === "active" || s === "paused";
const NS = {}, NLAST = {}, ES = {}, ELAST = {};
function node(k, state, o) {
  const st = NS[k] = NS[k] || {};
  st[o] = state;
  if (LIVE(state)) NLAST[k] = o;
  const g = nodeEls[k];
  const live = Object.keys(st).filter(x => LIVE(st[x]));
  g.classList.remove("active", "done", "paused", "dual");
  if (!live.length) { if (Object.values(st).includes("done")) g.classList.add("done"); return; }
  const prim = live.includes(NLAST[k]) ? NLAST[k] : live[0];
  const sec = live.find(x => x !== prim);
  g.classList.add(st[prim]); g.style.setProperty("--oc", C[prim]); g.style.setProperty("--ot", OT[prim]);
  if (sec) { g.classList.add("dual"); g.style.setProperty("--rc", C[sec]); }
}
// edges: hot while some order traverses it (last one colours it), done stays once any order traversed it
function edge(a, b, state, o) {
  const k = a + ">" + b, e = edgeEls[k], st = ES[k] = ES[k] || {};

  const hots = Object.keys(st).filter(x => st[x] === "hot");
  e.classList.remove("hot", "done");

}
async function hop(id, a, b, dur, o) {
  edge(a, b, "hot", o);
  const pts = edgeEls[a + ">" + b].getAttribute("points").split(" ").map(s => s.split(",").map(Number));
  pts[0] = [N[a].x, N[a].y]; pts[pts.length - 1] = [N[b].x, N[b].y];

async function story() {

  const my = ++runId;

}
